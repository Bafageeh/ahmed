name: Apply Ta3meed Overdue Card Styling

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-ta3meed-overdue-card.py'
      - '.github/workflows/apply-ta3meed-overdue-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip overdue card]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply overdue card styling
        run: python3 scripts/patch-ta3meed-overdue-card.py

      - name: Verify markers
        run: |
          grep -F "const isOverdueUnsettled" ahmed-mobile/Ta3meedCompactFiltersScreen.js
          grep -F "overdueUnsettledCard" ahmed-mobile/Ta3meedCompactFiltersScreen.js
          grep -F "overdueDetailsButtonText" ahmed-mobile/Ta3meedCompactFiltersScreen.js

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ahmed-mobile/Ta3meedCompactFiltersScreen.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Highlight overdue unsettled Ta3meed cards [skip overdue card]"
            git push
          fi
