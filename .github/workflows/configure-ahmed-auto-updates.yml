# trigger after workflow installation
name: Configure Ahmed Automatic Updates

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/configure-ahmed-auto-updates.yml'

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install expo-updates
        working-directory: ahmed-mobile
        run: npm install expo-updates@~57.0.12 --save --legacy-peer-deps --no-audit --no-fund

      - name: Configure automatic updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          app_path = Path('ahmed-mobile/app.json')
          app = json.loads(app_path.read_text(encoding='utf-8'))
          expo = app['expo']
          project_id = expo['extra']['eas']['projectId']
          expo['updates'] = {
              'enabled': True,
              'checkAutomatically': 'NEVER',
              'fallbackToCacheTimeout': 0,
              'url': f'https://u.expo.dev/{project_id}',
              'requestHeaders': {'expo-channel-name': 'production'},
          }
          expo['runtimeVersion'] = {'policy': 'appVersion'}
          app_path.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          eas_path = Path('ahmed-mobile/eas.json')
          eas = json.loads(eas_path.read_text(encoding='utf-8'))
          eas.setdefault('build', {}).setdefault('production', {})['channel'] = 'production'
          eas.setdefault('build', {}).setdefault('preview', {})['channel'] = 'preview'
          eas_path.write_text(json.dumps(eas, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          root_path = Path('ahmed-mobile/AppShellWithAccountSelector.js')
          text = root_path.read_text(encoding='utf-8')
          import_anchor = "import * as SecureStore from 'expo-secure-store';\n"
          update_import = "import * as Updates from 'expo-updates';\n"
          if update_import not in text:
              if import_anchor not in text:
                  raise SystemExit('SecureStore import anchor not found')
              text = text.replace(import_anchor, import_anchor + update_import, 1)

          ref_anchor = "  const triedAutoBio = useRef(false);\n"
          ref_line = "  const triedAutoUpdate = useRef(false);\n"
          if ref_line not in text:
              if ref_anchor not in text:
                  raise SystemExit('triedAutoBio anchor not found')
              text = text.replace(ref_anchor, ref_anchor + ref_line, 1)

          effect_anchor = "  useEffect(() => {\n    let mounted = true;\n"
          update_effect = '''  useEffect(() => {
    if (__DEV__ || Platform.OS === 'web' || triedAutoUpdate.current || !Updates.isEnabled) return undefined;
    triedAutoUpdate.current = true;
    let cancelled = false;

    (async () => {
      try {
        const result = await Updates.checkForUpdateAsync();
        if (!result.isAvailable) return;
        await Updates.fetchUpdateAsync();
        if (!cancelled) await Updates.reloadAsync();
      } catch (error) {
        // Keep the embedded version running if the update service is temporarily unavailable.
      }
    })();

    return () => { cancelled = true; };
  }, []);

'''
          if update_effect not in text:
              if effect_anchor not in text:
                  raise SystemExit('initial useEffect anchor not found')
              text = text.replace(effect_anchor, update_effect + effect_anchor, 1)
          root_path.write_text(text, encoding='utf-8')

          restart_path = Path('scripts/restart-ahmed-expo-fast.sh')
          restart = restart_path.read_text(encoding='utf-8')
          reset_anchor = 'git reset --hard origin/main\n\n'
          install_block = '''if [ ! -d "$MOBILE_DIR/node_modules/expo-updates" ]; then
  log "Installing new mobile dependencies"
  (cd "$MOBILE_DIR" && npm install --legacy-peer-deps --no-audit --no-fund)
fi

'''
          if install_block not in restart:
              if reset_anchor not in restart:
                  raise SystemExit('git reset anchor not found')
              restart = restart.replace(reset_anchor, reset_anchor + install_block, 1)
          restart_path.write_text(restart, encoding='utf-8')
          PY

      - name: Verify auto-update setup
        run: |
          grep -F "expo-updates" ahmed-mobile/package.json
          grep -F "https://u.expo.dev/" ahmed-mobile/app.json
          grep -F '"expo-channel-name": "production"' ahmed-mobile/app.json
          grep -F "Updates.checkForUpdateAsync" ahmed-mobile/AppShellWithAccountSelector.js
          grep -F "Updates.reloadAsync" ahmed-mobile/AppShellWithAccountSelector.js
          grep -F '"channel": "production"' ahmed-mobile/eas.json

      - name: Commit configuration
        run: |
          rm -f .github/workflows/configure-ahmed-auto-updates.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ahmed-mobile/package.json ahmed-mobile/package-lock.json ahmed-mobile/app.json ahmed-mobile/eas.json ahmed-mobile/AppShellWithAccountSelector.js scripts/restart-ahmed-expo-fast.sh .github/workflows/configure-ahmed-auto-updates.yml
          git commit -m "Enable automatic OTA updates in Ahmed"
          git push
