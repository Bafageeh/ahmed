name: Deploy Ahmed

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            export AHMED_PROJECT_PATH="${{ secrets.AHMED_PROJECT_PATH }}"
            export AHMED_DOMAIN="ahmed.pm.sa"
            export AHMED_EXPO_PORT="8082"

            if [ -z "$AHMED_PROJECT_PATH" ] || [ ! -d "$AHMED_PROJECT_PATH" ]; then
              if [ -d "/home/pmsa/apps/ahmed" ]; then
                export AHMED_PROJECT_PATH="/home/pmsa/apps/ahmed"
              elif [ -d "/mnt/home-storage/home/pmsa/apps/ahmed" ]; then
                export AHMED_PROJECT_PATH="/mnt/home-storage/home/pmsa/apps/ahmed"
              else
                echo "ERROR: Ahmed project path not found"
                exit 1
              fi
            fi

            cd "$AHMED_PROJECT_PATH"
            echo "[Ahmed Deploy] Project path: $AHMED_PROJECT_PATH"
            echo "[Ahmed Deploy] Bootstrap latest files from GitHub"
            git fetch origin main
            git reset --hard origin/main

            echo "[Ta3meed Diagnostic] Inspecting missing/new references"
            cd "$AHMED_PROJECT_PATH/ahmed-api"
            DB_PATH=$(grep -E '^DB_DATABASE=' .env | tail -1 | cut -d= -f2- | tr -d '\r\"')
            if [ -z "$DB_PATH" ]; then DB_PATH="database/database.sqlite"; fi
            if [ "${DB_PATH#/}" = "$DB_PATH" ]; then DB_PATH="$PWD/$DB_PATH"; fi
            export DB_PATH
            php -r '
              $dbPath = getenv("DB_PATH");
              if (!is_file($dbPath)) { echo "DIAG_DB_NOT_FOUND".PHP_EOL; exit(0); }
              $pdo = new PDO("sqlite:".$dbPath);
              $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
              $count = $pdo->query("SELECT COUNT(*) FROM investment_opportunities")->fetchColumn();
              echo "DIAG_COUNT=".$count.PHP_EOL;
              $cols = $pdo->query("PRAGMA table_info(investment_opportunities)")->fetchAll(PDO::FETCH_ASSOC);
              $hasUser = false; foreach ($cols as $c) { if (($c["name"] ?? "") === "user_id") $hasUser = true; }
              $select = $hasUser ? "id, reference_number, user_id, account_id, status, created_at" : "id, reference_number, NULL AS user_id, account_id, status, created_at";
              $stmt = $pdo->prepare("SELECT ".$select." FROM investment_opportunities WHERE lower(reference_number) LIKE lower(?) OR lower(reference_number) LIKE lower(?) ORDER BY id DESC LIMIT 20");
              $stmt->execute(["%WKCK%", "%803%"]);
              echo "DIAG_SIMILAR=".json_encode($stmt->fetchAll(PDO::FETCH_ASSOC), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              $rows = $pdo->query("SELECT ".$select." FROM investment_opportunities ORDER BY id DESC LIMIT 12")->fetchAll(PDO::FETCH_ASSOC);
              echo "DIAG_LATEST=".json_encode($rows, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            '
            cd "$AHMED_PROJECT_PATH"

            chmod +x scripts/restart-ahmed-expo-clean.sh scripts/deploy-ahmed.sh 2>/dev/null || true
            if [ -f scripts/restart-ahmed-expo-clean.sh ]; then
              bash scripts/restart-ahmed-expo-clean.sh
            else
              bash scripts/deploy-ahmed.sh
            fi
