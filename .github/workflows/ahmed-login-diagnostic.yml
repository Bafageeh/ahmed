name: Ahmed Login Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ahmed-login-diagnostic.yml'

permissions:
  contents: read
  issues: write

jobs:
  inspect-login:
    runs-on: ubuntu-latest
    steps:
      - name: Record diagnostic start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `🔎 Ahmed Tokenize diagnostic started | run_id=${context.runId} | commit=${context.sha}`,
            });

      - name: Verify Tokenize on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            PROJECT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$PROJECT" ] || [ ! -d "$PROJECT" ]; then
              if [ -d "/home/pmsa/apps/ahmed" ]; then
                PROJECT="/home/pmsa/apps/ahmed"
              else
                PROJECT="/mnt/home-storage/home/pmsa/apps/ahmed"
              fi
            fi
            cd "$PROJECT"
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/patch-tokenize-platform.py
            echo "SERVER_HEAD=$(git rev-parse HEAD)"
            grep -F 'TokenizeInvestmentsScreen' ahmed-mobile/AppShell.js
            grep -F "Route::get('/tokenize/investments'" ahmed-api/routes/api.php
            cd "$PROJECT/ahmed-api"
            php artisan optimize:clear >/dev/null 2>&1 || true
            php artisan route:list --path=tokenize
            php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
              $kernel->bootstrap();
              $request = Illuminate\Http\Request::create("/api/tokenize/investments", "GET");
              $request->attributes->set("ahmed_user_id", 1);
              $controller = app(App\Http\Controllers\Api\TokenizeInvestmentController::class);
              $response = $controller->index($request);
              echo "TOKENIZE_RESPONSE=".$response->getContent()."\n";
            '
            echo "HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://ahmed.pm.sa/api/health)"
