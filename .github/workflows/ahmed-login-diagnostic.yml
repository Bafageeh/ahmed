name: Ahmed Tokenize Profit Canonicalization

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ahmed-login-diagnostic.yml'

permissions:
  contents: write
  issues: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Record start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body: `🧮 Tokenize profit correction started | run_id=${context.runId}`});

      - uses: actions/checkout@v4

      - name: Apply and commit Tokenize profit correction
        run: |
          python3 scripts/patch-tokenize-platform.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ahmed-mobile/AppShell.js ahmed-mobile/TokenizeInvestmentsScreen.js ahmed-api/routes/api.php ahmed-api/app/Http/Controllers/Api/TokenizeInvestmentController.php
          if git diff --cached --quiet; then
            echo "Tokenize profit calculation already canonical"
            exit 0
          fi
          git commit -m "Calculate Tokenize profit from payment schedule"
          git push origin main
