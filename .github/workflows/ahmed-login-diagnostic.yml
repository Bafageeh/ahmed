name: Ahmed Tokenize Profit Verify

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ahmed-login-diagnostic.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Record verify start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body: `🧾 Tokenize profit verification started | run_id=${context.runId}`});

      - name: Verify Tokenize totals on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            PROJECT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$PROJECT" ] || [ ! -d "$PROJECT" ]; then
              if [ -d "/home/pmsa/apps/ahmed" ]; then
                PROJECT="/home/pmsa/apps/ahmed"
              else
                PROJECT="/mnt/home-storage/home/pmsa/apps/ahmed"
              fi
            fi
            cd "$PROJECT"
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/patch-tokenize-platform.py
            cd "$PROJECT/ahmed-api"
            php artisan optimize:clear >/dev/null 2>&1 || true
            php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
              $kernel->bootstrap();
              $request = Illuminate\Http\Request::create("/api/tokenize/investments", "GET");
              $request->attributes->set("ahmed_user_id", 1);
              $controller = app(App\Http\Controllers\Api\TokenizeInvestmentController::class);
              $response = $controller->index($request);
              $json = json_decode($response->getContent(), true);
              echo "EXPECTED_PROFIT=".$json["summary"]["expected_profit"]."\n";
              foreach ($json["data"] as $item) {
                $sum = 0;
                foreach ($item["payments"] as $p) $sum += (float)$p["profit_amount"];
                echo "OPPORTUNITY=".$item["external_key"]." PROFIT=".number_format($sum,2,".","")."\n";
                foreach ($item["payments"] as $p) echo "  ".$p["due_date"]." => ".number_format((float)$p["profit_amount"],2,".","")."\n";
              }
            '
