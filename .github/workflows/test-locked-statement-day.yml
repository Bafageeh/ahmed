name: Test Locked Statement Day

on:
  push:
    branches:
      - feature/show-locked-statement-day-20260908

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ahmed-mobile/package-lock.json
      - name: Install dependencies
        working-directory: ahmed-mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Export Android bundle
        working-directory: ahmed-mobile
        env:
          EXPO_PUBLIC_API_URL: https://ahmed.pm.sa/api
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: npx expo export --platform android --output-dir /tmp/ahmed-statement-day-test
