name: Ahmed iOS Store Submit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ahmed-ios-store-submit.yml'

permissions:
  contents: read

concurrency:
  group: ahmed-ios-store-submit
  cancel-in-progress: false

jobs:
  inspect-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check available upload connections
        id: health
        env:
          AHMED_PROBE_HOST: ${{ secrets.AHMED_SSH_HOST }}
          AHMED_CI_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, socket
          ready = False
          reason = ''
          try:
              with socket.create_connection((os.environ['AHMED_PROBE_HOST'], 2222), timeout=10) as connection:
                  connection.settimeout(10)
                  ready = connection.recv(256).startswith(b'SSH-')
                  reason = 'SSH banner received' if ready else 'No SSH banner'
          except Exception as error:
              reason = type(error).__name__
          has_token = bool(os.environ.get('AHMED_CI_EXPO_TOKEN'))
          print(json.dumps({'ssh_ready': ready, 'ssh_status': reason, 'ci_expo_token_available': has_token}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ssh_ready=' + str(ready).lower() + '\n')
          PY

      - name: Upload the verified Ahmed iOS release
        if: steps.health.outputs.ssh_ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 37m
          script: |
            set -eu
            AHMED_IOS_PROJECT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$AHMED_IOS_PROJECT" ] || [ ! -d "$AHMED_IOS_PROJECT/ahmed-mobile" ]; then
              if [ -d /home/pmsa/apps/ahmed/ahmed-mobile ]; then
                AHMED_IOS_PROJECT=/home/pmsa/apps/ahmed
              elif [ -d /mnt/home-storage/home/pmsa/apps/ahmed/ahmed-mobile ]; then
                AHMED_IOS_PROJECT=/mnt/home-storage/home/pmsa/apps/ahmed
              else
                echo 'Ahmed project directory is unavailable.'
                exit 1
              fi
            fi
            AHMED_IOS_STAGE="$(dirname "$AHMED_IOS_PROJECT")/ahmed-ios-releases/33967424514"
            export AHMED_IOS_STAGE
            cd "$AHMED_IOS_STAGE/source/ahmed-mobile"
            export CI=1 EXPO_NO_TELEMETRY=1
            node -e 'const a=require("./app.json").expo; if(a.ios.bundleIdentifier!=="sa.pm.ahmed"||a.extra.eas.projectId!=="85d588cc-f97a-4907-a248-0e778d83d674") process.exit(1); console.log(JSON.stringify({name:a.name,version:a.version,bundleIdentifier:a.ios.bundleIdentifier,projectId:a.extra.eas.projectId}));'
            node <<'NODE'
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const { spawn } = require('child_process');
            const { createAnalyticsAsync } = require('eas-cli/build/analytics/AnalyticsManager');
            const SessionManager = require('eas-cli/build/user/SessionManager').default;
            const { createGraphqlClient } = require('eas-cli/build/commandUtils/context/contextUtils/createGraphqlClient');
            const { BuildQuery } = require('eas-cli/build/graphql/queries/BuildQuery');
            const { SubmissionQuery } = require('eas-cli/build/graphql/queries/SubmissionQuery');
            const { AppStoreConnectApiKeyQuery } = require('eas-cli/build/graphql/queries/AppStoreConnectApiKeyQuery');
            const { AppStoreConnectApiKeyQuery: KeyMetadataQuery } = require('eas-cli/build/credentials/ios/api/graphql/queries/AppStoreConnectApiKeyQuery');
            const { withErrorHandlingAsync } = require('eas-cli/build/graphql/client');
            const gql = require('graphql-tag');
            (async () => {
              const analytics = await createAnalyticsAsync();
              const session = new SessionManager(analytics);
              const { authenticationInfo } = await session.ensureLoggedInAsync({nonInteractive:true});
              const client = createGraphqlClient(authenticationInfo);
              const projectId = '85d588cc-f97a-4907-a248-0e778d83d674';
              const buildId = '986691af-fa71-4c99-9f80-8c0e9d4d2b26';
              const build = await BuildQuery.withSubmissionsByIdAsync(client,buildId,{useCache:false});
              if (build.project?.id!==projectId || build.platform!=='IOS' || build.distribution!=='STORE' ||
                  build.appVersion!=='1.0.19' || build.appBuildVersion!=='4')
                throw new Error('Release identity does not match the requested Ahmed iOS build');
              console.log('AHMED_RELEASE=' + JSON.stringify({
                id:build.id,status:build.status,version:build.appVersion,buildNumber:build.appBuildVersion,
                archiveUrl:build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl || null
              }));
              const keyId = '39d791a9-8f87-4139-82ff-b2e4a8cf1b47';
              const keyPage = await KeyMetadataQuery.getAllForAccountPaginatedAsync(client,'bafageeh',{first:20});
              const metadata = keyPage.edges.map(edge=>edge.node).find(key=>key.id===keyId);
              if (metadata?.appleTeam?.appleTeamIdentifier!=='8PY9NA9CA2' || !metadata.roles.includes('ADMIN'))
                throw new Error('The saved upload key does not match the Ahmed Apple team');
              const key = await AppStoreConnectApiKeyQuery.getByIdAsync(client,keyId);
              const encode = value=>Buffer.from(JSON.stringify(value)).toString('base64url');
              const now = Math.floor(Date.now()/1000);
              const unsigned = encode({alg:'ES256',kid:key.keyIdentifier,typ:'JWT'}) + '.' +
                encode({iss:key.issuerIdentifier,iat:now,exp:now+600,aud:'appstoreconnect-v1'});
              const jwt = unsigned + '.' + crypto.sign('sha256',Buffer.from(unsigned),{
                key:key.keyP8,dsaEncoding:'ieee-p1363'
              }).toString('base64url');
              const response = await fetch('https://api.appstoreconnect.apple.com/v1/apps?' +
                new URLSearchParams({'filter[bundleId]':'sa.pm.ahmed','fields[apps]':'name,bundleId',limit:'5'}), {
                  headers:{Authorization:'Bearer '+jwt},signal:AbortSignal.timeout(25000),redirect:'error'
                });
              if(!response.ok) throw new Error('App Store lookup returned HTTP '+response.status);
              const body = await response.json();
              const matches = body.data.filter(app=>app.attributes.bundleId==='sa.pm.ahmed');
              if (matches.length===0) {
                console.log('AHMED_UPLOAD_BLOCKED=Create the Ahmed iOS app record in App Store Connect with bundle ID sa.pm.ahmed, then rerun this workflow.');
                await analytics.flushAsync();
                process.exitCode=2;
                return;
              }
              if (matches.length!==1 || matches[0].id!=='6809024498'
                throw new Error('Expected Ahmed App Store record 6809024498');
              if (build.status!=='FINISHED') throw new Error('The signed iOS build is not ready: '+build.status);
              const ascAppId = matches[0].id;
              console.log('AHMED_APP_STORE_APP=' + JSON.stringify({id:ascAppId,...matches[0].attributes}));
              const existing = build.submissions?.find(item =>
                item.iosConfig?.ascAppIdentifier===ascAppId && ['FINISHED','IN_PROGRESS','IN_QUEUE','AWAITING_BUILD'].includes(item.status));
              if (existing) {
                console.log('AHMED_EXISTING_SUBMISSION=' + JSON.stringify({id:existing.id,status:existing.status}));
                await analytics.flushAsync();
                return;
              }
              const credentialData = await withErrorHandlingAsync(client.query(gql`
                query AhmedSubmissionCredentials($appId: String!) {
                  app { byId(appId:$appId) { iosAppCredentials {
                    id appleAppIdentifier { bundleIdentifier } appleTeam { appleTeamIdentifier }
                    appStoreConnectApiKeyForSubmissions { id }
                  } } }
                }
              `,{appId:projectId}).toPromise());
              const credentials = credentialData.app.byId.iosAppCredentials.filter(item=>
                item.appleAppIdentifier.bundleIdentifier==='sa.pm.ahmed' && item.appleTeam?.appleTeamIdentifier==='8PY9NA9CA2');
              if(credentials.length!==1 || credentials[0].id!=='c9ecd9ca-f0fa-4f6b-90c2-f138103e774a')
                throw new Error('Unexpected Ahmed upload configuration');
              if(credentials[0].appStoreConnectApiKeyForSubmissions?.id!==keyId) {
                await withErrorHandlingAsync(client.mutation(gql`
                  mutation AhmedLinkUploadKey($id:ID!,$keyId:ID!) {
                    iosAppCredentials { setAppStoreConnectApiKeyForSubmissions(id:$id,ascApiKeyId:$keyId) { id } }
                  }
                `,{id:credentials[0].id,keyId}).toPromise());
              }
              const config = JSON.parse(fs.readFileSync('eas.json','utf8'));
              config.submit ??= {};
              config.submit.production ??= {};
              config.submit.production.ios = {...config.submit.production.ios,ascAppId,appleTeamId:'8PY9NA9CA2'};
              fs.writeFileSync('eas.json',JSON.stringify(config,null,2)+'\n');
              const child = spawn(process.execPath,[
                'node_modules/eas-cli/bin/run','submit','--platform','ios','--profile','production',
                '--id',buildId,'--non-interactive','--wait'
              ],{env:process.env,stdio:['ignore','inherit','inherit']});
              const code = await new Promise((resolve,reject)=>{
                child.once('error',reject);child.once('exit',resolve);
              });
              if(code!==0) throw new Error('The App Store upload did not complete');
              const completed = await BuildQuery.withSubmissionsByIdAsync(client,buildId,{useCache:false});
              const submission = completed.submissions?.find(item=>item.status==='FINISHED'&&item.iosConfig?.ascAppIdentifier===ascAppId);
              if(!submission) throw new Error('Unable to verify the completed Apple upload');
              const receipt = {buildId,version:'1.0.19',buildNumber:'4',ascAppId,submissionId:submission.id,status:submission.status};
              fs.writeFileSync(path.join(process.env.AHMED_IOS_STAGE,'submission-receipt.json'),JSON.stringify(receipt,null,2)+'\n');
              console.log('AHMED_APPLE_UPLOAD_COMPLETED='+JSON.stringify(receipt));
              await analytics.flushAsync();
            })().catch(error=>{console.error('Ahmed submission: '+error.message);process.exitCode=1;});
            NODE

# App Store Connect record 6809024498 supplied by the user; upload signed build 1.0.19 (4).
