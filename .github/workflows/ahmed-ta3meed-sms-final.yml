name: Ahmed Ta3meed SMS final account-scoped release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-ta3meed-sms-final.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: ahmed-ta3meed-sms-final-release
  cancel-in-progress: false
jobs:
  supersede:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the superseded native build before its publish step
        uses: actions/github-script@v7
        with:
          script: |
            const args={owner:context.repo.owner,repo:context.repo.repo,run_id:40234913853};
            const run=await github.rest.actions.getWorkflowRun(args);
            if(run.data.status!=='completed') {
              try { await github.rest.actions.cancelWorkflowRun(args); }
              catch(error) { if(error.status!==409) throw error; }
            }
  verify:
    needs: supersede
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check mobile permissions, old-version gating and account switches
        run: node --experimental-vm-modules scripts/test-sms-client.cjs
      - name: Install API dependencies for isolated tests
        working-directory: ahmed-api
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Verify new-message cutoff, sender, encryption, retries and account isolation
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php scripts/test-sms-capture.php "$GITHUB_WORKSPACE"
  deliver:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify complete production source and guard notification ownership
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 3m
          script: |
            set -eu
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_SHA="${{ github.sha }}"
            git -C "$ROOT" fetch origin "$AHMED_SMS_SHA"
            python3 - <<'PYCODE'
            from pathlib import Path
            import os,json,hashlib,subprocess,tempfile
            root=Path(os.environ['AHMED_SMS_ROOT']);sha=os.environ['AHMED_SMS_SHA']
            read=lambda name:subprocess.check_output(['git','show',sha+':'+name],cwd=root)
            manifest=json.loads(read('scripts/ta3meed-sms-notifier-release.json'))
            for name,expected in manifest['baseline'].items():
                live=root/name;actual=hashlib.sha256(live.read_bytes()).hexdigest()
                assert actual in {expected,manifest['files'].get(name)},'Production source changed since review: '+name
                desired=hashlib.sha256(read(name)).hexdigest()
                assert desired==manifest['files'].get(name,expected),'Build source differs from reviewed production: '+name
            case=root.parent.parent/'secure-backups/ahmed/ta3meed-sms-final-20261026';case.mkdir(parents=True,exist_ok=True);case.chmod(0o700)
            for name,digest in manifest['files'].items():
                live=root/name;data=read(name);assert hashlib.sha256(data).hexdigest()==digest
                backup=case/live.name
                if not backup.exists():backup.write_bytes(live.read_bytes());backup.chmod(0o600)
                owner=live.stat();fd,tmp=tempfile.mkstemp(prefix='.sms-owner-',dir=live.parent)
                try:
                    with os.fdopen(fd,'wb') as f:f.write(data);f.flush();os.fsync(f.fileno())
                    os.chmod(tmp,0o644)
                    if os.geteuid()==0:os.chown(tmp,owner.st_uid,owner.st_gid)
                    assert hashlib.sha256(live.read_bytes()).hexdigest() in {manifest['baseline'][name],digest}
                    os.replace(tmp,live)
                finally:
                    if os.path.exists(tmp):os.unlink(tmp)
                assert hashlib.sha256(live.read_bytes()).hexdigest()==digest
            print('TA3MEED_FINAL_COMPLETE_SOURCE_AND_NOTIFICATION_OWNER_VERIFIED files='+str(len(manifest['baseline'])))
            PYCODE
  build-apk:
    needs: deliver
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://ahmed.pm.sa/api
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ahmed-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Read the installed release signing certificate and version
        run: |
          mkdir -p apk-check
          curl --fail --location --retry 3 'https://pm.sa/downloads/ahmed-sms-1.0.22.apk' -o apk-check/previous.apk
          AHMED_APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AHMED_AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AHMED_APKSIGNER"
          test -n "$AHMED_AAPT"
          echo "AHMED_APKSIGNER=$AHMED_APKSIGNER" >> "$GITHUB_ENV"
          echo "AHMED_AAPT=$AHMED_AAPT" >> "$GITHUB_ENV"
          "$AHMED_APKSIGNER" verify --print-certs apk-check/previous.apk > apk-check/previous-signature.txt
          python3 scripts/apk-signer-fingerprint.py apk-check/previous.apk > apk-check/previous-fingerprint.txt
          "$AHMED_AAPT" dump badging apk-check/previous.apk > apk-check/previous-package.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,re
          package=Path('apk-check/previous-package.txt').read_text();assert "package: name='sa.pm.ahmed'" in package
          previous=int(re.search(r"versionCode='([0-9]+)'",package).group(1))
          p=Path('ahmed-mobile/app.json');config=json.loads(p.read_text());assert config['expo']['version']=='1.0.23'
          config['expo']['android']['versionCode']=max(config['expo']['android']['versionCode'],previous+1)
          p.write_text(json.dumps(config,indent=2)+'\n')
          print('SMS_APK_VERSION_CODE',config['expo']['android']['versionCode'])
          PYCODE
      - name: Install the verified mobile dependencies
        working-directory: ahmed-mobile
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Generate Android with the SMS and existing income-widget modules
        working-directory: ahmed-mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Confirm the signing key matches the previous installed APK
        run: |
          keytool -exportcert -keystore ahmed-mobile/android/app/debug.keystore -storepass android -alias androiddebugkey -file apk-check/candidate.der
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,re
          expected=Path('apk-check/previous-fingerprint.txt').read_text().strip()
          actual=hashlib.sha256(Path('apk-check/candidate.der').read_bytes()).hexdigest()
          assert actual==expected,'Signing certificate does not match the installed release'
          print('SMS_PREVIOUS_SIGNING_CERTIFICATE_MATCHED',actual)
          PYCODE
      - name: Compile native Android and produce the release APK
        working-directory: ahmed-mobile/android
        run: |
          chmod +x gradlew
          timeout 38m ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace --max-workers=2
      - name: Verify signed APK, SMS permission, new-message-only access and preserved widget
        id: apk_metadata
        run: |
          mkdir -p ahmed-mobile/build-output
          cp ahmed-mobile/android/app/build/outputs/apk/release/*.apk ahmed-mobile/build-output/ahmed-sms-1.0.23.apk
          "$AHMED_APKSIGNER" verify --print-certs ahmed-mobile/build-output/ahmed-sms-1.0.23.apk > apk-check/new-signature.txt
          "$AHMED_AAPT" dump permissions ahmed-mobile/build-output/ahmed-sms-1.0.23.apk > apk-check/new-permissions.txt
          "$AHMED_AAPT" dump xmltree ahmed-mobile/build-output/ahmed-sms-1.0.23.apk AndroidManifest.xml > apk-check/new-manifest.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,re,os,subprocess
          actual=subprocess.check_output(['python3','scripts/apk-signer-fingerprint.py','ahmed-mobile/build-output/ahmed-sms-1.0.23.apk']).decode().strip()
          assert actual==Path('apk-check/previous-fingerprint.txt').read_text().strip()
          permissions=Path('apk-check/new-permissions.txt').read_text();assert 'android.permission.RECEIVE_SMS' in permissions
          assert 'android.permission.POST_NOTIFICATIONS' in permissions
          assert 'android.permission.READ_SMS' not in permissions
          manifest=Path('apk-check/new-manifest.txt').read_text()
          for entry in ['expo.modules.ahmedsmscapture.IncomingSmsReceiver','expo.modules.ahmedsmscapture.SmsUploadJob','ExpectedIncomeWidgetProvider']:
            assert entry in manifest,'Required native entry is missing: '+entry
          apk=Path('ahmed-mobile/build-output/ahmed-sms-1.0.23.apk');digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha256='+digest+'\n')
          print('SMS_SIGNED_APK_VERIFIED bytes='+str(apk.stat().st_size)+' sha256='+digest)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: ahmed-sms-1.0.23-apk
          path: ahmed-mobile/build-output/ahmed-sms-1.0.23.apk
          if-no-files-found: error
      - name: Publish the verified APK to the existing pm.sa downloads directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          source: ahmed-mobile/build-output/ahmed-sms-1.0.23.apk
          target: /home/pmsa/public_html/downloads
          strip_components: 2
          overwrite: true
          timeout: 120s
          command_timeout: 10m
      - name: Verify the live APK download
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 2m
          script: |
            python3 - <<'PYCODE'
            from pathlib import Path
            import hashlib,urllib.request
            p=Path('/home/pmsa/public_html/downloads/ahmed-sms-1.0.23.apk')
            expected='${{ steps.apk_metadata.outputs.sha256 }}'
            assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
            p.chmod(0o644)
            url='https://pm.sa/downloads/ahmed-sms-1.0.23.apk'
            with urllib.request.urlopen(urllib.request.Request(url,method='HEAD'),timeout=30) as response:
              assert response.code==200 and int(response.headers.get('Content-Length',0))==p.stat().st_size
            print('SMS_APK_READY '+url+' sha256='+expected)
            PYCODE
