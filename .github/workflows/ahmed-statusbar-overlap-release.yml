name: Ahmed SMS and investor balance header safe area
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-statusbar-overlap-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ahmed-statusbar-overlap-release
  cancel-in-progress: false
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare the complete current production source before changing headers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 6m
          script: |
            set -eu
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_SHA="d95058b8f16030b2cb7a0b81d00ae94599b72b6e"
            export AHMED_APK_CASE="/home/pmsa/secure-backups/ahmed/sms-balance-safe-area-20261028/source"
            mkdir -p "$AHMED_APK_CASE"
            chmod 700 "$AHMED_APK_CASE"
            git -C "$ROOT" fetch origin "${{ github.sha }}"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/verify-live-apk-source.py" > "$AHMED_APK_CASE/verify.py"
            python3 "$AHMED_APK_CASE/verify.py"
  deliver:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Compile and publish the two header fixes to Expo, web, and production updates
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 22m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_CASE="/home/pmsa/secure-backups/ahmed/sms-balance-safe-area-20261028" AHMED_SMS_SHA="${{ github.sha }}"
            export AHMED_UI_RELEASE_MANIFEST="scripts/statusbar-overlap-release-20261028.json"
            mkdir -p "$AHMED_SMS_CASE"
            chmod 700 "$AHMED_SMS_CASE"
            git -C "$ROOT" fetch origin "$AHMED_SMS_SHA"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/deliver-statusbar-overlap.py" > "$AHMED_SMS_CASE/deliver.py"
            python3 "$AHMED_SMS_CASE/deliver.py"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/publish-investment-sms.py" > "$AHMED_SMS_CASE/publish.py"
            python3 "$AHMED_SMS_CASE/publish.py"
