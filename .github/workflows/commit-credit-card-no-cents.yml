name: Commit Credit Card No Cents

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/commit-credit-card-no-cents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply permanent source patch
        run: python3 scripts/patch-credit-card-no-cents.py

      - name: Commit source if changed
        run: |
          if git diff --quiet -- ahmed-mobile/CreditCardDebtsScreen.js; then
            echo "Source already matches Expo runtime patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ahmed-mobile/CreditCardDebtsScreen.js
          git commit -m "Make credit card amounts match Expo display"
          git push origin main
