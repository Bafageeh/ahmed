name: Restore secure vault bank accounts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-secure-vault-bank-accounts.yml'
      - 'scripts/restore-secure-vault-bank-accounts.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore bank account UI and form
        run: python3 scripts/restore-secure-vault-bank-accounts.py

      - name: Commit restored account flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ahmed-mobile/SecureVaultScreen.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore bank accounts in secure vault"
            git push
          fi
