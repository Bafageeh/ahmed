name: Ahmed iOS App Store Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ahmed-ios-preflight.yml'

permissions:
  contents: read

jobs:
  inspect-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check available upload connections
        id: health
        env:
          AHMED_PROBE_HOST: ${{ secrets.AHMED_SSH_HOST }}
          AHMED_CI_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, socket
          ready = False
          reason = ''
          try:
              with socket.create_connection((os.environ['AHMED_PROBE_HOST'], 2222), timeout=10) as connection:
                  connection.settimeout(10)
                  ready = connection.recv(256).startswith(b'SSH-')
                  reason = 'SSH banner received' if ready else 'No SSH banner'
          except Exception as error:
              reason = type(error).__name__
          has_token = bool(os.environ.get('AHMED_CI_EXPO_TOKEN'))
          print(json.dumps({'ssh_ready': ready, 'ssh_status': reason, 'ci_expo_token_available': has_token}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ssh_ready=' + str(ready).lower() + '\n')
          PY

      - name: Inspect Ahmed iOS build and submission status
        if: steps.health.outputs.ssh_ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 4m
          script: |
            set -eu
            AHMED_IOS_PROJECT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$AHMED_IOS_PROJECT" ] || [ ! -d "$AHMED_IOS_PROJECT/ahmed-mobile" ]; then
              if [ -d /home/pmsa/apps/ahmed/ahmed-mobile ]; then
                AHMED_IOS_PROJECT=/home/pmsa/apps/ahmed
              elif [ -d /mnt/home-storage/home/pmsa/apps/ahmed/ahmed-mobile ]; then
                AHMED_IOS_PROJECT=/mnt/home-storage/home/pmsa/apps/ahmed
              else
                echo 'Ahmed project directory is unavailable.'
                exit 1
              fi
            fi
            cd "$AHMED_IOS_PROJECT/ahmed-mobile"
            export CI=1 EXPO_NO_TELEMETRY=1
            node -e 'const a=require("./app.json").expo; if(a.ios.bundleIdentifier!=="sa.pm.ahmed"||a.extra.eas.projectId!=="85d588cc-f97a-4907-a248-0e778d83d674") process.exit(1); console.log(JSON.stringify({name:a.name,version:a.version,bundleIdentifier:a.ios.bundleIdentifier,projectId:a.extra.eas.projectId}));'
            timeout --kill-after=5s 150s node <<'NODE'
            const crypto = require('crypto');
            const { createAnalyticsAsync } = require('eas-cli/build/analytics/AnalyticsManager');
            const SessionManager = require('eas-cli/build/user/SessionManager').default;
            const { createGraphqlClient } = require('eas-cli/build/commandUtils/context/contextUtils/createGraphqlClient');
            const { AppStoreConnectApiKeyQuery } = require('eas-cli/build/graphql/queries/AppStoreConnectApiKeyQuery');
            const { AppStoreConnectApiKeyQuery: KeyMetadataQuery } = require('eas-cli/build/credentials/ios/api/graphql/queries/AppStoreConnectApiKeyQuery');
            const gql = require('graphql-tag');
            const { withErrorHandlingAsync } = require('eas-cli/build/graphql/client');
            (async () => {
              const analytics = await createAnalyticsAsync();
              const session = new SessionManager(analytics);
              const { authenticationInfo } = await session.ensureLoggedInAsync({ nonInteractive: true });
              const client = createGraphqlClient(authenticationInfo);
              const appId = require('./app.json').expo.extra.eas.projectId;
              if (appId !== '85d588cc-f97a-4907-a248-0e778d83d674') throw new Error('Unexpected Expo project');
              const data = await withErrorHandlingAsync(client.query(gql`
                query AhmedIosSigningReadiness($appId: String!) {
                  app { byId(appId: $appId) { iosAppCredentials {
                    id
                    appleTeam { appleTeamIdentifier }
                    appleAppIdentifier { bundleIdentifier }
                    appStoreConnectApiKeyForSubmissions { id roles }
                    iosAppBuildCredentialsList {
                      id iosDistributionType
                      provisioningProfile { id developerPortalIdentifier status }
                      distributionCertificate { id serialNumber developerPortalIdentifier }
                    }
                  } } }
                }
              `, { appId }).toPromise());
              const credentials = data.app.byId.iosAppCredentials.filter(item =>
                item.appleAppIdentifier.bundleIdentifier === 'sa.pm.ahmed' &&
                item.appleTeam?.appleTeamIdentifier === '8PY9NA9CA2');
              if (credentials.length !== 1) throw new Error('Expected one Ahmed signing configuration');
              console.log('IOS_SIGNING_METADATA=' + JSON.stringify(credentials));
              const keyId = '39d791a9-8f87-4139-82ff-b2e4a8cf1b47';
              const keyPage = await KeyMetadataQuery.getAllForAccountPaginatedAsync(client, 'bafageeh', { first: 20 });
              const metadata = keyPage.edges.map(edge => edge.node).find(key => key.id === keyId);
              if (metadata?.appleTeam?.appleTeamIdentifier !== '8PY9NA9CA2' || !metadata.roles.includes('ADMIN'))
                throw new Error('Apple upload key must belong to the verified Ahmed team');
              const key = await AppStoreConnectApiKeyQuery.getByIdAsync(client, keyId);
              const now = Math.floor(Date.now()/1000);
              const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
              const unsigned = encode({ alg:'ES256', kid:key.keyIdentifier, typ:'JWT' }) + '.' +
                encode({ iss:key.issuerIdentifier, iat:now, exp:now+600, aud:'appstoreconnect-v1' });
              const signature = crypto.sign('sha256', Buffer.from(unsigned), { key:key.keyP8, dsaEncoding:'ieee-p1363' }).toString('base64url');
              const jwt = unsigned + '.' + signature;
              async function appleGet(path, method='GET', payload) {
                const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + path, {
                  method, body:payload ? JSON.stringify(payload) : undefined,
                  headers:{ Authorization:'Bearer ' + jwt, 'Content-Type':'application/json' }, signal:AbortSignal.timeout(25000), redirect:'error'
                });
                const body = await response.json();
                if (!response.ok) {
                  console.log('APPLE_API_ERROR=' + JSON.stringify({status:response.status,errors:body.errors?.map(e=>({code:e.code,title:e.title}))}));
                  throw new Error('Apple API lookup failed');
                }
                return body;
              }
              const apps = await appleGet('apps?' + new URLSearchParams({
                'filter[bundleId]':'sa.pm.ahmed','fields[apps]':'name,bundleId,sku,primaryLocale',limit:'5'
              }));
              console.log('AHMED_APP_STORE_RECORDS=' + JSON.stringify(apps.data.map(app => ({id:app.id,...app.attributes}))));
              const bundles = await appleGet('bundleIds?' + new URLSearchParams({
                'filter[identifier]':'sa.pm.ahmed',include:'bundleIdCapabilities',limit:'5'
              }));
              console.log('AHMED_APPLE_BUNDLE=' + JSON.stringify({
                bundles:bundles.data.map(item=>({id:item.id,...item.attributes})),
                capabilities:bundles.included?.filter(item=>item.type==='bundleIdCapabilities').map(item=>({id:item.id,...item.attributes}))
              }));
              if (bundles.data.length !== 1 || bundles.data[0].id !== 'M866W5K2SA' || bundles.data[0].attributes.seedId !== '8PY9NA9CA2')
                throw new Error('Unexpected Apple bundle identity');
              const certificate = (await appleGet('certificates/ZMXV7NXCZ4')).data;
              if (certificate.attributes.serialNumber !== '5FA8C82893210FAB4F73B771DDC0E987' ||
                  new Date(certificate.attributes.expirationDate).getTime() <= Date.now())
                throw new Error('The saved distribution certificate is not valid');
              const buildCredentials = credentials[0].iosAppBuildCredentialsList.find(item=>item.iosDistributionType==='APP_STORE');
              if (buildCredentials?.provisioningProfile?.id !== 'e3a9f15a-69db-4575-8fae-9ff70c736cd9' ||
                  buildCredentials.distributionCertificate.developerPortalIdentifier !== certificate.id)
                throw new Error('Unexpected App Store signing configuration');
              if (!bundles.included?.some(item=>item.attributes?.capabilityType==='PUSH_NOTIFICATIONS')) {
                await appleGet('bundleIdCapabilities', 'POST', { data:{
                  type:'bundleIdCapabilities',attributes:{capabilityType:'PUSH_NOTIFICATIONS'},
                  relationships:{bundleId:{data:{type:'bundleIds',id:'M866W5K2SA'}}}
                }});
                console.log('AHMED_PUSH_CAPABILITY=enabled');
              }
              const profileName = '[expo] sa.pm.ahmed AppStore Push 2026-09-05';
              const profiles = await appleGet('profiles?' + new URLSearchParams({'filter[name]':profileName,limit:'5'}));
              let profile = profiles.data.find(item=>item.attributes.name===profileName);
              if (!profile) {
                profile = (await appleGet('profiles', 'POST', {data:{
                  type:'profiles',attributes:{name:profileName,profileType:'IOS_APP_STORE'},
                  relationships:{
                    bundleId:{data:{type:'bundleIds',id:'M866W5K2SA'}},
                    certificates:{data:[{type:'certificates',id:certificate.id}]}
                  }
                }})).data;
              }
              const { parse } = require('eas-cli/build/credentials/ios/utils/provisioningProfile');
              const parsed = parse(profile.attributes.profileContent);
              const entitlements = parsed.Entitlements;
              if (parsed.TeamIdentifier?.[0] !== '8PY9NA9CA2' ||
                  entitlements?.['application-identifier'] !== '8PY9NA9CA2.sa.pm.ahmed' ||
                  entitlements?.['aps-environment'] !== 'production' ||
                  entitlements?.['get-task-allow'] || parsed.ProvisionedDevices ||
                  new Date(parsed.ExpirationDate).getTime() <= Date.now())
                throw new Error('The replacement profile failed signing validation');
              const updated = await withErrorHandlingAsync(client.mutation(gql`
                mutation AhmedUpdateStoreProfile($id: ID!, $input: AppleProvisioningProfileInput!) {
                  appleProvisioningProfile {
                    updateAppleProvisioningProfile(id:$id,appleProvisioningProfileInput:$input) {
                      id developerPortalIdentifier status expiration
                    }
                  }
                }
              `, {
                id:buildCredentials.provisioningProfile.id,
                input:{appleProvisioningProfile:profile.attributes.profileContent,developerPortalIdentifier:profile.id}
              }).toPromise());
              console.log('AHMED_STORE_PROFILE_REPAIRED=' + JSON.stringify({
                ...updated.appleProvisioningProfile.updateAppleProvisioningProfile,
                bundleIdentifier:'sa.pm.ahmed',pushEnvironment:entitlements['aps-environment']
              }));
              // Restore only an existing Apple session; never request or print login secrets.
              const {Auth,JsonFileCache} = require('@expo/apple-utils');
              const cached = await JsonFileCache.getCacheAsync(JsonFileCache.usernameCachePath());
              if (!cached?.username) {
                console.log('AHMED_APPLE_SESSION=' + JSON.stringify({cachedUsernameAvailable:false,restored:false}));
              } else {
                try {
                  const appleSession = await Auth.tryRestoringAuthStateFromUserCredentialsAsync({
                    username:cached.username,teamId:'8PY9NA9CA2'
                  },{autoResolveProvider:true});
                  console.log('AHMED_APPLE_SESSION=' + JSON.stringify({
                    cachedUsernameAvailable:true,restored:!!appleSession,teamId:appleSession?.context?.teamId || null
                  }));
                } catch (error) {
                  console.log('AHMED_APPLE_SESSION=' + JSON.stringify({cachedUsernameAvailable:true,restored:false,errorType:error.name}));
                }
              }
            
              await analytics.flushAsync();
            })().catch(error => { console.error('Ahmed Apple readiness failed: ' + error.name); process.exitCode = 1; });
            NODE
