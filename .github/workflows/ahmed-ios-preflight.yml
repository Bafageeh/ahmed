name: Ahmed iOS App Store Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ahmed-ios-preflight.yml'

permissions:
  contents: read

jobs:
  inspect-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check available upload connections
        id: health
        env:
          AHMED_PROBE_HOST: ${{ secrets.AHMED_SSH_HOST }}
          AHMED_CI_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, socket
          ready = False
          reason = ''
          try:
              with socket.create_connection((os.environ['AHMED_PROBE_HOST'], 2222), timeout=10) as connection:
                  connection.settimeout(10)
                  ready = connection.recv(256).startswith(b'SSH-')
                  reason = 'SSH banner received' if ready else 'No SSH banner'
          except Exception as error:
              reason = type(error).__name__
          has_token = bool(os.environ.get('AHMED_CI_EXPO_TOKEN'))
          print(json.dumps({'ssh_ready': ready, 'ssh_status': reason, 'ci_expo_token_available': has_token}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ssh_ready=' + str(ready).lower() + '\n')
          PY

      - name: Inspect Ahmed iOS build and submission status
        if: steps.health.outputs.ssh_ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 4m
          script: |
            set -eu
            AHMED_IOS_PROJECT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$AHMED_IOS_PROJECT" ] || [ ! -d "$AHMED_IOS_PROJECT/ahmed-mobile" ]; then
              if [ -d /home/pmsa/apps/ahmed/ahmed-mobile ]; then
                AHMED_IOS_PROJECT=/home/pmsa/apps/ahmed
              elif [ -d /mnt/home-storage/home/pmsa/apps/ahmed/ahmed-mobile ]; then
                AHMED_IOS_PROJECT=/mnt/home-storage/home/pmsa/apps/ahmed
              else
                echo 'Ahmed project directory is unavailable.'
                exit 1
              fi
            fi
            cd "$AHMED_IOS_PROJECT/ahmed-mobile"
            export CI=1 EXPO_NO_TELEMETRY=1
            node -e 'const a=require("./app.json").expo; if(a.ios.bundleIdentifier!=="sa.pm.ahmed"||a.extra.eas.projectId!=="85d588cc-f97a-4907-a248-0e778d83d674") process.exit(1); console.log(JSON.stringify({name:a.name,version:a.version,bundleIdentifier:a.ios.bundleIdentifier,projectId:a.extra.eas.projectId}));'
            test -f node_modules/eas-cli/bin/run
            echo 'Checking the installed Expo session'
            timeout --kill-after=5s 45s node node_modules/eas-cli/bin/run whoami
            timeout --kill-after=5s 45s node node_modules/eas-cli/bin/run project:info
            timeout --kill-after=5s 45s node node_modules/eas-cli/bin/run --version
            AHMED_IOS_DIAG_DIR="$(mktemp -d)"
            export AHMED_IOS_DIAG_DIR
            trap 'rm -rf "$AHMED_IOS_DIAG_DIR"' EXIT
            timeout --kill-after=5s 45s node node_modules/eas-cli/bin/run build:list --platform ios --limit 5 --json --non-interactive > "$AHMED_IOS_DIAG_DIR/builds.json"
            timeout --kill-after=5s 45s node node_modules/eas-cli/bin/run build:version:get --platform ios --profile production --json --non-interactive > "$AHMED_IOS_DIAG_DIR/version.json" || true
            timeout --kill-after=5s 45s node <<'NODE'
            const { createAnalyticsAsync } = require('eas-cli/build/analytics/AnalyticsManager');
            const SessionManager = require('eas-cli/build/user/SessionManager').default;
            const { createGraphqlClient } = require('eas-cli/build/commandUtils/context/contextUtils/createGraphqlClient');
            const { SubmissionQuery } = require('eas-cli/build/graphql/queries/SubmissionQuery');
            (async () => {
              const analytics = await createAnalyticsAsync();
              const session = new SessionManager(analytics);
              const { authenticationInfo } = await session.ensureLoggedInAsync({ nonInteractive: true });
              const client = createGraphqlClient(authenticationInfo);
              const appId = require('./app.json').expo.extra.eas.projectId;
              if (appId !== '85d588cc-f97a-4907-a248-0e778d83d674') throw new Error('Unexpected Expo project');
              const history = await SubmissionQuery.allForAppAsync(client, appId, { limit: 5, platform: 'IOS' });
              console.log('IOS_SUBMISSION_HISTORY=' + JSON.stringify(history.map(item => ({
                id: item.id, status: item.status, ascAppId: item.iosConfig?.ascAppIdentifier || null
              }))));
              const gql = require('graphql-tag');
              const { withErrorHandlingAsync } = require('eas-cli/build/graphql/client');
              const data = await withErrorHandlingAsync(client.query(gql`
                query AhmedIosSubmissionReadiness($appId: String!) {
                  app { byId(appId: $appId) {
                    iosAppCredentials {
                      appleTeam { appleTeamIdentifier }
                      appleAppIdentifier { bundleIdentifier }
                      appStoreConnectApiKeyForSubmissions { id roles }
                    }
                  } }
                }
              `, { appId }).toPromise());
              console.log('IOS_STORE_READINESS=' + JSON.stringify(data.app.byId.iosAppCredentials
                .filter(item => item.appleAppIdentifier.bundleIdentifier === 'sa.pm.ahmed')
                .map(item => ({ bundleIdentifier:item.appleAppIdentifier.bundleIdentifier,
                  appleTeamId:item.appleTeam?.appleTeamIdentifier,
                  hasSubmissionApiKey:!!item.appStoreConnectApiKeyForSubmissions,
                  apiKeyId:item.appStoreConnectApiKeyForSubmissions?.id || null,
                  apiKeyRoles:item.appStoreConnectApiKeyForSubmissions?.roles || [] }))));
              const { AppStoreConnectApiKeyQuery } = require('eas-cli/build/credentials/ios/api/graphql/queries/AppStoreConnectApiKeyQuery');
              const keyPage = await AppStoreConnectApiKeyQuery.getAllForAccountPaginatedAsync(client, 'bafageeh', { first: 20 });
              console.log('IOS_TEAM_UPLOAD_KEYS=' + JSON.stringify(keyPage.edges.map(edge => edge.node)
                .filter(key => key.appleTeam?.appleTeamIdentifier === '8PY9NA9CA2')
                .map(key => ({ id:key.id, roles:key.roles, createdAt:key.createdAt }))));
              await analytics.flushAsync();
            })().catch(error => { console.error(error.message); process.exitCode = 1; });
            NODE
            python3 - <<'PY'
            import json, os, pathlib, re
            root = pathlib.Path(os.environ['AHMED_IOS_DIAG_DIR'])
            blocked = re.compile(r'token|secret|password|private|credential|certificate|authorization|header|apikey|logfile|artifact|email', re.I)
            def safe(value):
                if isinstance(value, dict):
                    return {key: safe(item) for key, item in value.items() if not blocked.search(key)}
                if isinstance(value, list):
                    return [safe(item) for item in value]
                if isinstance(value, str) and value.startswith('https://'):
                    return value.split('?')[0]
                return value
            for path in root.glob('*.json'):
                try:
                    value = json.loads(path.read_text())
                except (ValueError, OSError):
                    print(path.name + ': unavailable')
                    continue
                if path.name == 'builds.json':
                    fields = ['id', 'status', 'platform', 'distribution', 'appIdentifier', 'appVersion', 'appBuildVersion', 'gitCommitHash', 'createdAt', 'completedAt', 'error']
                    value = [{key: item[key] for key in fields if key in item} for item in value]
                print(path.name + ': ' + json.dumps(safe(value), ensure_ascii=False))
            PY

# Requested iOS upload preflight: 2026-09-05. Reuse the existing authenticated CLI.

# Invoke the installed CLI directly without npm package resolution.

# Resume requested Apple upload after a bounded server connectivity check.

# Inspect the existing App Store app identifier from Ahmed submission history.
