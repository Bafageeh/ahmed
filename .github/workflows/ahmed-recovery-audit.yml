name: Ahmed Recovery Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-recovery-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve current files and inspect recovery sources
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 10m
          script: |
            set -eu
            umask 077
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then
              ROOT="/home/pmsa/apps/ahmed"
            fi
            test -d "$ROOT/.git"
            CASE="$(dirname "$ROOT")/ahmed-recovery-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$CASE"
            export AHMED_RECOVERY_ROOT="$ROOT"
            export AHMED_RECOVERY_CASE="$CASE"
            printf 'RECOVERY_COPY=%s\n' "$CASE"
            tar -C "$ROOT" -czf "$CASE/current-source-and-git.tar.gz" \
              --exclude='./ahmed-mobile/node_modules' \
              --exclude='./ahmed-api/vendor' \
              --exclude='./ahmed-api/storage/logs' \
              --exclude='./ahmed-api/storage/framework' \
              --exclude='./ahmed-mobile/.expo' \
              --exclude='./ahmed-mobile/.expo-shared' \
              --exclude='./ahmed-mobile/.metro-cache' \
              --exclude='./ahmed-mobile/android/.gradle' \
              --exclude='./ahmed-mobile/android/app/build' \
              --exclude='./ahmed-mobile/ios/Pods' .
            printf 'SOURCE_AND_GIT_PRESERVED\n'
            cd "$ROOT"
            printf 'GIT_STATUS_START\n'
            git status --short | head -100
            printf 'GIT_REFLOG_START\n'
            git reflog --all --date=iso --format='%h %gd %gs' -60
            printf 'GIT_ALL_COMMITS_START\n'
            git log --all -35 --format='%h %ad %s' --date=iso
            printf 'GIT_UNREACHABLE_START\n'
            git fsck --no-reflogs --unreachable 2>/dev/null | head -100 || true
            python3 - <<'PY'
            import os, json, subprocess, pathlib, datetime, sqlite3
            root = pathlib.Path(os.environ["AHMED_RECOVERY_ROOT"])
            archive = pathlib.Path(os.environ["AHMED_RECOVERY_CASE"])
            skip = {".git", "node_modules", "vendor", ".expo", ".expo-shared", ".cache", ".metro-cache", "Pods", ".gradle", "logs", "framework", "sessions"}
            tracked = set(subprocess.check_output(["git", "-C", str(root), "ls-files"], text=True).splitlines())
            candidates = []
            exports = []
            for base, dirs, files in os.walk(root):
                dirs[:] = [d for d in dirs if d not in skip]
                for name in files:
                    p = pathlib.Path(base) / name
                    rel = str(p.relative_to(root))
                    low = name.lower()
                    try: st = p.stat()
                    except OSError: continue
                    record = {"path": rel, "bytes": st.st_size, "modified": datetime.datetime.fromtimestamp(st.st_mtime, datetime.timezone.utc).isoformat()}
                    is_backup = any(x in low for x in [".bak", ".backup", ".orig", ".save", "snapshot", "backup"]) or low.endswith((".tgz", ".tar.gz", ".zip"))
                    is_untracked_source = rel not in tracked and p.suffix in {".js", ".jsx", ".ts", ".tsx", ".php", ".json", ".map"} and not any(x in rel for x in ["assets/", "storage/"])
                    if is_backup or is_untracked_source:
                        candidates.append(record)
                    if low.endswith(".map") or ("dist" in rel or "webapp" in rel or "mobile-web" in rel) and p.suffix in {".html", ".js", ".json"}:
                        exports.append(record)
            print("RECOVERY_CANDIDATES", json.dumps(sorted(candidates, key=lambda x:x["modified"], reverse=True)[:220], ensure_ascii=False))
            print("WEB_EXPORTS", json.dumps(sorted(exports, key=lambda x:x["modified"], reverse=True)[:45], ensure_ascii=False))
            siblings = []
            parent = root.parent
            for base, dirs, files in os.walk(parent):
                depth = len(pathlib.Path(base).relative_to(parent).parts)
                dirs[:] = [d for d in dirs if d not in skip and (depth > 0 or "ahmed" in d.lower() or "backup" in d.lower()) and not (pathlib.Path(base)/d == root) and not (pathlib.Path(base)/d == archive)]
                if depth >= 3: dirs[:] = []
                for name in files:
                    if not any(x in name.lower() for x in ["ahmed", "backup", "ta3meed"]): continue
                    p=pathlib.Path(base)/name
                    try: st=p.stat()
                    except OSError: continue
                    siblings.append({"path":str(p),"bytes":st.st_size,"modified":datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat()})
            print("RELATED_BACKUPS", json.dumps(sorted(siblings,key=lambda x:x["modified"],reverse=True)[:120],ensure_ascii=False))
            db=root/"ahmed-api/database/database.sqlite"
            if db.is_file():
                src=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True)
                dst=sqlite3.connect(str(archive/"database.sqlite"))
                src.backup(dst)
                dst.close()
                src.close()
                print("SQLITE_BACKUP_PRESERVED")
            PY
            printf 'AUDIT_COMPLETE\n'
