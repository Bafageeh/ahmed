name: Ahmed Recovery Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-recovery-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-login-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Repair runtime cache ownership and verify HTTP authentication responses
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 5m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_RECOVERY_ROOT="$ROOT"
            export AHMED_RECOVERY_CASE="$(dirname "$ROOT")/ahmed-recovery-20261023T092158Z"
            python3 - <<'PY'
            import os,pathlib,json,stat,subprocess,time,re
            root=pathlib.Path(os.environ["AHMED_RECOVERY_ROOT"]);case=pathlib.Path(os.environ["AHMED_RECOVERY_CASE"])/"login-diagnostic";case.mkdir(exist_ok=True)
            api=root/"ahmed-api";owner=(api/".env").stat();changes=[]
            for directory in [api/"bootstrap/cache",api/"storage/framework",api/"storage/logs"]:
                for base,dirs,files in os.walk(str(directory)):
                    p=pathlib.Path(base);st=p.stat()
                    if st.st_uid==0:
                        changes.append({"path":str(p.relative_to(root)),"uid":st.st_uid,"gid":st.st_gid,"mode":stat.S_IMODE(st.st_mode)})
                        os.chown(str(p),owner.st_uid,owner.st_gid)
                        os.chmod(str(p),0o755)
                    for name in files:
                        q=p/name
                        if q.is_symlink() or name==".gitignore": continue
                        st=q.stat()
                        if st.st_uid!=0: continue
                        changes.append({"path":str(q.relative_to(root)),"uid":st.st_uid,"gid":st.st_gid,"mode":stat.S_IMODE(st.st_mode)})
                        os.chown(str(q),owner.st_uid,owner.st_gid)
                        os.chmod(str(q),0o644 if q.parent==api/"bootstrap/cache" and q.name in {"packages.php","services.php"} else 0o640)
            (case/"runtime-permission-changes.json").write_text(json.dumps(changes))
            print("RUNTIME_PERMISSIONS_CORRECTED",len(changes))
            for name,url,data,expected in [
                ("health","https://ahmed.pm.sa/api/health",None,200),
                ("invalid-login","https://ahmed.pm.sa/api/ahmed/session",{"username":"__ahmed_recovery_health_probe_20261023__","password":"not-a-real-account-password"},422),
                ("protected-session","https://ahmed.pm.sa/api/ahmed/session",None,401)
            ]:
                out=case/(name+"-after.body")
                cmd=["curl","-sS","--max-time","30","-H","Accept: application/json","-o",str(out),"-w","%{http_code}",url]
                if data is not None: cmd.extend(["-H","Content-Type: application/json","--data",json.dumps(data)])
                response=subprocess.check_output(cmd,universal_newlines=True).strip()
                payload=json.loads(out.read_text())
                assert int(response)==expected,"Unexpected HTTP status "+name+" "+response
                print("LOGIN_HTTP_VERIFIED",json.dumps({"probe":name,"status":int(response),"json":True,"message":payload.get("message")},ensure_ascii=False))
            (case/"http-login-restored.json").write_text(json.dumps({"health":200,"invalid_credentials":422,"unauthenticated_session":401,"password_changed":False,"existing_sessions_changed":False,"permission_files_changed":len(changes)}))
            PY
