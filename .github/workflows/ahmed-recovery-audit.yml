name: Ahmed Recovery Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-recovery-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production source, web, Expo and installed app channel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 5m
          script: |
            set -eu
            umask 077
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            CASE="$(dirname "$ROOT")/ahmed-recovery-20261023T092158Z"
            export AHMED_RECOVERY_ROOT="$ROOT"
            export AHMED_RECOVERY_CASE="$CASE"
            test -f "$CASE/restoration-complete.json"
            cd "$ROOT"
            git fetch origin main
            cd "$ROOT/ahmed-mobile"
            npx eas-cli channel:view production --json > "$CASE/production-channel-recovered.json"
            python3 - <<'PY'
            import pathlib,os,json,subprocess,hashlib,urllib.request,re
            root=pathlib.Path(os.environ["AHMED_RECOVERY_ROOT"])
            case=pathlib.Path(os.environ["AHMED_RECOVERY_CASE"])
            head=subprocess.check_output(["git","-C",str(root),"rev-parse","origin/main"],universal_newlines=True).strip()
            files=subprocess.check_output(["git","-C",str(root),"ls-tree","-r","--name-only","origin/main"],universal_newlines=True).splitlines()
            checked=0;mismatches=[]
            for key in files:
                if not key.startswith(("ahmed-mobile/","ahmed-api/app/","ahmed-api/routes/","ahmed-api/database/migrations/")): continue
                if "/dist-web/" in key or pathlib.Path(key).suffix not in {".js",".jsx",".ts",".tsx",".php",".json"}: continue
                p=root/key
                expected=subprocess.check_output(["git","-C",str(root),"show","origin/main:"+key])
                if not p.is_file() or hashlib.sha256(p.read_bytes()).digest()!=hashlib.sha256(expected).digest(): mismatches.append(key)
                checked+=1
            assert not mismatches,"Repository/source mismatch: "+json.dumps(mismatches)
            channel=json.loads((case/"production-channel-recovered.json").read_text())
            page=channel.get("currentPage",channel)
            groups=[u for branch in page["updateBranches"] for group in branch["updateGroups"] for u in group if u["runtimeVersion"]=="1.0.19"]
            expected="c6fe9244-2738-4066-9fca-38a9dc38dabd"
            assert groups and groups[0]["group"]==expected,"Production update channel not recovered"
            assert {x["platform"] for x in groups if x["group"]==expected}=={"android","ios"}
            index=subprocess.check_output(["curl","-fsS","--max-time","20","https://ahmed.pm.sa/webapp/?recovery=20261023"])
            assert b"index-9ac1dfa2cf81c19d8518b35bad1e9609.js" in index
            status=subprocess.check_output(["curl","-fsS","--max-time","5","http://127.0.0.1:8082/status"])
            assert b"packager-status:running" in status
            result={"verified":True,"repository_source_files_checked":checked,"source_matches_repository":True,"source_commit":head,"production_group":expected,"production_platforms":["android","ios"],"web_live":True,"expo_running":True,"database_restored":False}
            (case/"final-verification.json").write_text(json.dumps(result))
            print("FINAL_RECOVERY_VERIFICATION",json.dumps(result))
            PY
