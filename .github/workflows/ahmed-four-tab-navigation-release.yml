name: Ahmed four-tab bottom navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-four-tab-navigation-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ahmed-four-tab-navigation-release
  cancel-in-progress: false
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare the complete current production source before removing the Wealth bottom tab
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 6m
          script: |
            set -eu
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_SHA="a1b54b15f12a2cff8af024038366570d55a4217f"
            export AHMED_APK_CASE="/home/pmsa/secure-backups/ahmed/four-tab-navigation-20261028/source"
            mkdir -p "$AHMED_APK_CASE"
            chmod 700 "$AHMED_APK_CASE"
            git -C "$ROOT" fetch origin "${{ github.sha }}"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/verify-live-apk-source.py" > "$AHMED_APK_CASE/verify.py"
            python3 "$AHMED_APK_CASE/verify.py"
  deliver:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify and publish the four-item bottom navigation to Expo, web, and production updates
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 22m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_CASE="/home/pmsa/secure-backups/ahmed/four-tab-navigation-20261028" AHMED_SMS_SHA="${{ github.sha }}"
            export AHMED_UI_RELEASE_MANIFEST="scripts/four-tab-navigation-release-20261028.json"
            mkdir -p "$AHMED_SMS_CASE"
            chmod 700 "$AHMED_SMS_CASE"
            git -C "$ROOT" fetch origin "$AHMED_SMS_SHA"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/deliver-four-tab-navigation.py" > "$AHMED_SMS_CASE/deliver.py"
            python3 "$AHMED_SMS_CASE/deliver.py"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/publish-investment-sms.py" > "$AHMED_SMS_CASE/publish.py"
            python3 "$AHMED_SMS_CASE/publish.py"

