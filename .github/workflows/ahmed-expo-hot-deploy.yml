name: Ahmed Expo Hot Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'ahmed-mobile/**'
      - 'scripts/restart-ahmed-expo-fast.sh'
      - '.github/workflows/ahmed-expo-hot-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  restart-expo:
    name: Sync and restart Expo 8082
    runs-on: ubuntu-latest

    steps:
      - name: Restart Ahmed Expo over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            export AHMED_PROJECT_PATH="${{ secrets.AHMED_PROJECT_PATH }}"
            export AHMED_DOMAIN="ahmed.pm.sa"
            export AHMED_EXPO_PORT="8082"

            if [ -z "$AHMED_PROJECT_PATH" ] || [ ! -d "$AHMED_PROJECT_PATH" ]; then
              if [ -d "/home/pmsa/apps/ahmed" ]; then
                export AHMED_PROJECT_PATH="/home/pmsa/apps/ahmed"
              elif [ -d "/mnt/home-storage/home/pmsa/apps/ahmed" ]; then
                export AHMED_PROJECT_PATH="/mnt/home-storage/home/pmsa/apps/ahmed"
              else
                echo "ERROR: Ahmed project path not found"
                exit 1
              fi
            fi

            cd "$AHMED_PROJECT_PATH"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/restart-ahmed-expo-fast.sh
            bash scripts/restart-ahmed-expo-fast.sh

      - name: Record successful restart
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `✅ Ahmed Expo 8082 restarted successfully from commit ${context.sha} at ${new Date().toISOString()}`,
            });
