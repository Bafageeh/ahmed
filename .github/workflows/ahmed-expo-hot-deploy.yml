name: Ahmed Expo Hot Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'ahmed-mobile/**'
      - 'scripts/restart-ahmed-expo-fast.sh'
      - '.github/workflows/ahmed-expo-hot-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  restart-expo:
    name: Sync Expo 8082 and publish OTA
    runs-on: ubuntu-latest

    steps:
      - name: Record OTA deploy start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `⏳ Ahmed OTA deploy started | run_id=${context.runId} | commit=${context.sha}`,
            });

      - name: Restart Ahmed Expo and publish OTA over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            export AHMED_PROJECT_PATH="${{ secrets.AHMED_PROJECT_PATH }}"
            export AHMED_DOMAIN="ahmed.pm.sa"
            export AHMED_EXPO_PORT="8082"

            if [ -z "$AHMED_PROJECT_PATH" ] || [ ! -d "$AHMED_PROJECT_PATH" ]; then
              if [ -d "/home/pmsa/apps/ahmed" ]; then
                export AHMED_PROJECT_PATH="/home/pmsa/apps/ahmed"
              elif [ -d "/mnt/home-storage/home/pmsa/apps/ahmed" ]; then
                export AHMED_PROJECT_PATH="/mnt/home-storage/home/pmsa/apps/ahmed"
              else
                echo "ERROR: Ahmed project path not found"
                exit 1
              fi
            fi

            cd "$AHMED_PROJECT_PATH"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/restart-ahmed-expo-fast.sh
            bash scripts/restart-ahmed-expo-fast.sh

            cd "$AHMED_PROJECT_PATH/ahmed-mobile"
            echo "Checking Expo account for automatic OTA publishing"
            npx eas-cli whoami
            echo "Publishing Ahmed OTA update to production"
            npx eas-cli update --channel production --platform android --environment production --message "Automatic Ahmed update ${{ github.sha }}" --non-interactive

      - name: Record successful restart and OTA publish
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `✅ Ahmed Expo 8082 restarted and 🚀 OTA update published to production from commit ${context.sha} at ${new Date().toISOString()}`,
            });

# Automatic OTA publishing enabled 2026-08-22
