name: Apply secure vault single bank login

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/patch-secure-vault-single-login.py"
      - ".github/workflows/apply-secure-vault-single-bank-login.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip secure vault single login]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply secure vault patch
        run: python3 scripts/patch-secure-vault-single-login.py

      - name: Validate patch
        run: |
          grep -q "formMode === 'bankLogin'" ahmed-mobile/SecureVaultScreen.js
          grep -q "لكل بنك بيانات دخول واحدة فقط" ahmed-api/app/Http/Controllers/Api/SecureVaultController.php
          ! grep -q "إضافة دخول للبنك" ahmed-mobile/SecureVaultScreen.js
          git diff --check

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ahmed-mobile/SecureVaultScreen.js ahmed-api/app/Http/Controllers/Api/SecureVaultController.php
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Enforce one bank login per bank [skip secure vault single login]"
            git push
          fi
