name: Fix Ta3meed Source Screen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair Ta3meed source safely
        run: |
          python3 scripts/patch-ta3meed-navigation-callbacks.py
          python3 scripts/patch-ta3meed-quick-menu.py
          python3 scripts/patch-credit-card-no-cents.py

      - name: Verify repaired source
        run: |
          grep -F 'اختصارات تعميد' ahmed-mobile/Ta3meedCompactFiltersScreen.js
          grep -F 'إضافة واعتماد دفعة تعميد' ahmed-mobile/Ta3meedCompactFiltersScreen.js
          grep -F "onOpenInvestorAccounts={() => setInvestmentScreen('ta3meedAccounts')}" ahmed-mobile/AppShell.js
          grep -F "onOpenImageImport={() => setInvestmentScreen('ta3meedImageImport')}" ahmed-mobile/AppShell.js
          grep -F 'minimumFractionDigits: 0' ahmed-mobile/CreditCardDebtsScreen.js

# This is a manual recovery/verification workflow only. Normal mobile changes
# are delivered by Ahmed Expo Hot Deploy and must not mutate source in a loop.
