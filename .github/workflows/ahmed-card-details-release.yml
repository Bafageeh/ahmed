name: Ahmed company and profit rate card update without APK
# Wait for actual review effects before checking the rendered form.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-card-details-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ahmed-card-details-release
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify actual card behavior and calculation checks
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40353297116});
            if(run.head_sha!=='b7310d671ab74fc829db27d5fe2580a45cacb71b'||run.conclusion!=='success')throw new Error('Actual card checks must pass before publishing');
      - name: Publish the reviewed card layout to web and production OTA without APK
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 22m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_CASE="/home/pmsa/secure-backups/ahmed/card-details-20261026" AHMED_SMS_SHA="${{ github.sha }}"
            export AHMED_UI_RELEASE_MANIFEST="scripts/card-details-release-20261026.json"
            mkdir -p "$AHMED_SMS_CASE"
            chmod 700 "$AHMED_SMS_CASE"
            git -C "$ROOT" fetch origin "$AHMED_SMS_SHA"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/deliver-card-details.py" > "$AHMED_SMS_CASE/deliver.py"
            python3 "$AHMED_SMS_CASE/deliver.py"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/publish-investment-sms.py" > "$AHMED_SMS_CASE/publish.py"
            python3 "$AHMED_SMS_CASE/publish.py"
