name: Ahmed investor accounts header safe area without APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-investor-safe-area.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ahmed-investor-safe-area-release
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Compile the investor accounts header and publish the JavaScript-only safe-area fix
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 22m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_CASE="/home/pmsa/secure-backups/ahmed/investor-safe-area-20261026" AHMED_SMS_SHA="${{ github.sha }}"
            export AHMED_UI_RELEASE_MANIFEST="scripts/investor-safe-area-release-20261026.json"
            mkdir -p "$AHMED_SMS_CASE"
            chmod 700 "$AHMED_SMS_CASE"
            git -C "$ROOT" fetch origin "$AHMED_SMS_SHA"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/deliver-header-safe-area.py" > "$AHMED_SMS_CASE/deliver.py"
            python3 "$AHMED_SMS_CASE/deliver.py"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/publish-header-safe-area.py" > "$AHMED_SMS_CASE/publish.py"
            python3 "$AHMED_SMS_CASE/publish.py"
