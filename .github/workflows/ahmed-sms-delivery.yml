name: Ahmed new SMS capture and APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-sms-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ahmed-sms-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, openssl
          coverage: none
      - name: Install API dependencies for isolated tests
        working-directory: ahmed-api
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Verify new-message cutoff, sender, encryption, retries and account isolation
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php scripts/test-sms-capture.php "$GITHUB_WORKSPACE"
  deliver:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Apply guarded SMS source, migrate only SMS tables and verify API and Expo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 12m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_CASE="/home/pmsa/secure-backups/ahmed/sms-20261025" AHMED_SMS_SHA="${{ github.sha }}"
            mkdir -p "$AHMED_SMS_CASE"
            chmod 700 "$AHMED_SMS_CASE"
            git -C "$ROOT" fetch origin "$AHMED_SMS_SHA"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/deliver-sms-capture.py" > "$AHMED_SMS_CASE/deliver.py"
            python3 "$AHMED_SMS_CASE/deliver.py"
      - name: Build signed Android APK and verify its download URL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 60m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            export AHMED_SMS_ROOT="$ROOT" AHMED_SMS_CASE="/home/pmsa/secure-backups/ahmed/sms-20261025" AHMED_SMS_SHA="${{ github.sha }}"
            git -C "$ROOT" show "$AHMED_SMS_SHA:scripts/build-sms-apk.py" > "$AHMED_SMS_CASE/build-apk.py"
            python3 "$AHMED_SMS_CASE/build-apk.py"

# Server deployment supports the existing Python 3.6 runtime.
