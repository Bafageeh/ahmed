name: Fix Ta3meed Receipt Scope

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-ta3meed-receipt-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch controller
        run: python3 scripts/fix-ta3meed-receipt-scope.py

      - name: Validate controller
        run: php -l ahmed-api/app/Http/Controllers/Api/Ta3meedReceiptController.php

      - name: Commit controller fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ahmed-api/app/Http/Controllers/Api/Ta3meedReceiptController.php
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Ta3meed receipt user isolation"
            git push
          fi
