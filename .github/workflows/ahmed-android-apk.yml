name: Ahmed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ahmed-mobile
    env:
      EXPO_PUBLIC_API_URL: https://ahmed.pm.sa/api
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - name: Record APK build start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `⏳ Ahmed APK build started | run_id=${context.runId} | commit=${context.sha}`,
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply same source patches used by Expo
        run: |
          cd ..
          python3 scripts/patch-ta3meed-quick-menu.py
          python3 scripts/patch-credit-card-no-cents.py
          python3 scripts/patch-tokenize-platform.py
          grep -F 'اختصارات تعميد' ahmed-mobile/Ta3meedCompactFiltersScreen.js
          grep -F "onOpenInvestorAccounts={() => setInvestmentScreen('ta3meedAccounts')}" ahmed-mobile/AppShell.js
          grep -F 'minimumFractionDigits: 0' ahmed-mobile/CreditCardDebtsScreen.js
          grep -F 'TokenizeInvestmentsScreen' ahmed-mobile/AppShell.js
          grep -F "Route::get('/tokenize/investments'" ahmed-api/routes/api.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ahmed-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Restore approved Ahmed app icon
        run: |
          python3 scripts/generate_app_icon.py
          file assets/approved-app-icon.png assets/icon.png assets/splash-icon.png assets/adaptive-icon.png

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/*.apk apk/ahmed-release.apk
          ls -lh apk/ahmed-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-android-apk
          path: ahmed-mobile/apk/ahmed-release.apk
          if-no-files-found: error

      - name: Record APK run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `📦 Ahmed APK ready | run_id=${context.runId} | commit=${context.sha} | artifact=ahmed-android-apk`,
            });

# APK builds are manual only; normal app changes are delivered through OTA.
