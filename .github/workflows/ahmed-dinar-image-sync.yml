name: Dinar Image Data Sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-dinar-image-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahmed-dinar-image-sync
  cancel-in-progress: false

jobs:
  import-verified-dinar-data:
    runs-on: ubuntu-latest
    steps:
      - name: Match and import the private Dinar observation plan
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 8m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            CASE="/home/pmsa/secure-backups/ahmed/dinar-sync-20261023"
            export AHMED_DINAR_ROOT="$ROOT" AHMED_DINAR_CASE="$CASE" AHMED_DINAR_COMMIT="${{ github.sha }}"
            test -f "$CASE/server-private.pem"
            if [ -f "$CASE/complete.json" ]; then echo "DINAR_IMAGES_ALREADY_IMPORTED"; exit 0; fi
            git -C "$ROOT" fetch origin main
            python3 - <<'PY'
            import os,pathlib,subprocess
            root=pathlib.Path(os.environ['AHMED_DINAR_ROOT']);case=pathlib.Path(os.environ['AHMED_DINAR_CASE'])
            stage=case/'staged';stage.mkdir(exist_ok=True,mode=0o700);os.chmod(str(stage),0o700)
            for name in ['import-dinar-observations.py','verify-dinar-observations.php']:
                data=subprocess.check_output(['git','-C',str(root),'show',os.environ['AHMED_DINAR_COMMIT']+':scripts/'+name])
                out=stage/name;out.write_bytes(data);os.chmod(str(out),0o600)
            PY
            /usr/local/bin/php <<'PHP'
            <?php
            $case=getenv('AHMED_DINAR_CASE');
            $encoded='';
            $envelope=json_decode(base64_decode($encoded,true),true,512,JSON_THROW_ON_ERROR);
            if(!openssl_private_decrypt(base64_decode($envelope['key'],true),$key,file_get_contents($case.'/server-private.pem'),OPENSSL_PKCS1_OAEP_PADDING)) throw new RuntimeException('Unable to open protected observation plan');
            $body=openssl_decrypt(base64_decode($envelope['ciphertext'],true),'aes-256-gcm',$key,OPENSSL_RAW_DATA,base64_decode($envelope['iv'],true),base64_decode($envelope['tag'],true));
            if($body===false) throw new RuntimeException('Observation authentication failed');
            $plan=gzdecode($body);json_decode($plan,true,512,JSON_THROW_ON_ERROR);
            file_put_contents($case.'/import-plan.json',$plan);chmod($case.'/import-plan.json',0600);
            echo "DINAR_PRIVATE_PLAN_AUTHENTICATED\n";
            PHP
            /usr/local/bin/php -l "$CASE/staged/verify-dinar-observations.php"
            python3 - <<'PY'
            import os,pathlib,json,hashlib,sqlite3
            root=pathlib.Path(os.environ['AHMED_DINAR_ROOT']);case=pathlib.Path(os.environ['AHMED_DINAR_CASE'])
            plan=json.loads((case/'import-plan.json').read_text())
            allowed={'ahmed-api/app/Http/Controllers/Api/DinarInvestmentController.php','ahmed-api/app/Http/Controllers/Api/TenantDinarInvestmentController.php','ahmed-mobile/DinarInvestmentsScreen.js','ahmed-mobile/dinarInvestmentMath.js','ahmed-mobile/AppShell.js'}
            assert {x['path'] for x in plan['source_files']}==allowed
            for item in plan['source_files']: assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256'],'Concurrent application source edit'
            clone=case/'isolated-test.sqlite'
            if clone.exists(): clone.unlink()
            original=sqlite3.connect('file:'+str(root/'ahmed-api/database/database.sqlite')+'?mode=ro',uri=True)
            original.execute('BEGIN');copy=sqlite3.connect(str(clone));copy.executescript('\n'.join(original.iterdump()));copy.close();original.rollback();original.close();os.chmod(str(clone),0o600)
            print('DINAR_UNCHANGED_APPLICATION_SOURCE_AND_ISOLATED_DATABASE_READY')
            PY
            python3 "$CASE/staged/import-dinar-observations.py" --database "$CASE/isolated-test.sqlite" --plan "$CASE/import-plan.json"
            python3 "$CASE/staged/import-dinar-observations.py" --database "$CASE/isolated-test.sqlite" --plan "$CASE/import-plan.json" --result "$CASE/repeat-test.json"
            /usr/local/bin/php "$CASE/staged/verify-dinar-observations.php" "$ROOT" "$CASE/isolated-test.sqlite" "$CASE/import-plan.json" "$CASE/isolated-api.json"
            cd "$ROOT/ahmed-mobile"
            node <<'JS'
            const fs=require('fs'),path=require('path'),assert=require('assert');
            const babel=require('@babel/core'),generate=require('@babel/generator').default;
            const root=process.env.AHMED_DINAR_ROOT,folder=process.env.AHMED_DINAR_CASE;
            const plan=JSON.parse(fs.readFileSync(path.join(folder,'import-plan.json'),'utf8'));
            const payload=JSON.parse(fs.readFileSync(path.join(folder,'isolated-api.json'),'utf8'));
            const math=require(path.join(root,'ahmed-mobile/dinarInvestmentMath.js'));
            const capital=payload.data.reduce((sum,item)=>sum+math.dinarRemainingInvestment(item),0);
            const pending=payload.data.reduce((sum,item)=>sum+math.dinarExpectedDistributions(item)-math.dinarGrossPaidDistributions(item),0);
            assert(Math.abs(capital-plan.expected.total_investment)<0.001,'Dinar screen capital differs');
            assert(Math.abs(pending-plan.expected.remaining_distributions)<0.001,'Dinar screen distributions differ');
            const filename=path.join(root,'ahmed-mobile/AppShell.js');
            const ast=babel.parseSync(fs.readFileSync(filename,'utf8'),{filename,configFile:path.join(root,'ahmed-mobile/babel.config.js'),babelrc:false});
            const screen=ast.program.body.find(n=>n.type==='FunctionDeclaration'&&n.id.name==='FutureMonthlyIncomeScreen');
            const declaration=screen.body.body.filter(n=>n.type==='VariableDeclaration').flatMap(n=>n.declarations).find(n=>n.id.name==='loadDinarIncome');
            assert(declaration,'Actual future income loader missing');
            const run=new Function('fetch','API_URL','ahmedUserHeaders','dinarRemainingInvestment','setDinarMonthlyIncome','return ('+generate(declaration.init).code+')();');
            let income=null;
            (async()=>{
              await run(async()=>({ok:true,json:async()=>payload}),'https://ahmed.pm.sa/api',x=>x,math.dinarRemainingInvestment,x=>{income=x;});
              assert(Math.abs(income-plan.expected.monthly_income)<0.001,'Future monthly income did not follow Dinar current capital');
              console.log('DINAR_EXISTING_UI_MATH_AND_FUTURE_MONTHLY_INCOME_VERIFIED');
            })().catch(error=>{console.error(error.message);process.exitCode=1;});
            JS
            python3 - <<'PY'
            import os,pathlib,json,hashlib
            root=pathlib.Path(os.environ['AHMED_DINAR_ROOT']);case=pathlib.Path(os.environ['AHMED_DINAR_CASE'])
            result=json.loads((case/'repeat-test.json').read_text());assert result['updated']==0 and result['inserted']==0,'Repeat import changed records'
            for item in json.loads((case/'import-plan.json').read_text())['source_files']:
                assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256'],'Application source changed during tests'
            print('DINAR_REPEAT_IMPORT_AND_SOURCE_PRESERVATION_VERIFIED')
            PY
            python3 "$CASE/staged/import-dinar-observations.py" --database "$ROOT/ahmed-api/database/database.sqlite" --plan "$CASE/import-plan.json" --backup "$CASE/database-before-import.sql" --result "$CASE/import-result.json"
            /usr/local/bin/php "$CASE/staged/verify-dinar-observations.php" "$ROOT" "$ROOT/ahmed-api/database/database.sqlite" "$CASE/import-plan.json" "$CASE/live-api.json"
            python3 - <<'PY'
            import os,pathlib,json,subprocess,hashlib
            root=pathlib.Path(os.environ['AHMED_DINAR_ROOT']);case=pathlib.Path(os.environ['AHMED_DINAR_CASE'])
            for item in json.loads((case/'import-plan.json').read_text())['source_files']:
                assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256'],'Application source changed'
            for name,url,data,expected in [('health','https://ahmed.pm.sa/api/health',None,200),('invalid-login','https://ahmed.pm.sa/api/ahmed/session',{'username':'__dinar_sync_health_check__','password':'not-a-real-password'},422),('protected-session','https://ahmed.pm.sa/api/ahmed/session',None,401)]:
                out=case/(name+'.json');cmd=['curl','-sS','--max-time','30','-H','Accept: application/json','-o',str(out),'-w','%{http_code}',url]
                if data is not None:cmd+=['-H','Content-Type: application/json','--data',json.dumps(data)]
                actual=int(subprocess.check_output(cmd,universal_newlines=True));json.loads(out.read_text());os.chmod(str(out),0o600)
                assert actual==expected,'Unexpected authentication response';print('DINAR_HTTP_VERIFIED',name,actual)
            result={'complete':True,'source_commit':os.environ['AHMED_DINAR_COMMIT'],'import':json.loads((case/'import-result.json').read_text()),'application_source_changed':False,'database_restored':False,'monthly_income_connection_verified':True}
            (case/'complete.json').write_text(json.dumps(result));os.chmod(str(case/'complete.json'),0o600)
            print('DINAR_IMAGES_SYNC_COMPLETED',json.dumps(result,sort_keys=True))
            PY
