name: Sulfa Image Data Sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ahmed-sulfa-image-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahmed-sulfa-image-sync
  cancel-in-progress: false

jobs:
  import-verified-sulfa-observations:
    runs-on: ubuntu-latest
    steps:
      - name: Verify, import and publish the scoped Sulfa update
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 20m
          script: |
            set -eu
            umask 022
            ROOT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/.git" ]; then ROOT="/home/pmsa/apps/ahmed"; fi
            CASE="/home/pmsa/secure-backups/ahmed/sulfa-sync-20261023"
            TARGET="${{ github.sha }}"
            export AHMED_SULFA_ROOT="$ROOT" AHMED_SULFA_CASE="$CASE" AHMED_SULFA_TARGET="$TARGET"
            test -f "$CASE/server-private.pem"
            if [ -f "$CASE/sync-complete.json" ]; then echo "SULFA_SYNC_ALREADY_COMPLETE"; exit 0; fi
            git -C "$ROOT" fetch origin main
            python3 - <<'PY'
            import os,pathlib,subprocess
            root=pathlib.Path(os.environ['AHMED_SULFA_ROOT']);case=pathlib.Path(os.environ['AHMED_SULFA_CASE'])
            stage=case/'staged';stage.mkdir(exist_ok=True,mode=0o700);os.chmod(str(stage),0o700)
            paths=['ahmed-api/app/Http/Controllers/Api/SulfaInvestmentController.php','ahmed-mobile/SulfaInvestmentScreen.js','scripts/import-sulfa-observations.py','scripts/verify-sulfa-observations.php']
            for name in paths:
                content=subprocess.check_output(['git','-C',str(root),'show',os.environ['AHMED_SULFA_TARGET']+':'+name])
                target=stage/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content);os.chmod(str(target),0o600)
            PY
            /usr/local/bin/php <<'PHP'
            <?php
            $case=getenv('AHMED_SULFA_CASE');
            $encoded='';
            $envelope=json_decode(base64_decode($encoded,true),true,512,JSON_THROW_ON_ERROR);
            if(!openssl_private_decrypt(base64_decode($envelope['key'],true),$key,file_get_contents($case.'/server-private.pem'),OPENSSL_PKCS1_OAEP_PADDING)) throw new RuntimeException('Unable to open protected observation plan');
            $body=openssl_decrypt(base64_decode($envelope['ciphertext'],true),'aes-256-gcm',$key,OPENSSL_RAW_DATA,base64_decode($envelope['iv'],true),base64_decode($envelope['tag'],true));
            if($body===false) throw new RuntimeException('Observation authentication failed');
            $plan=gzdecode($body);json_decode($plan,true,512,JSON_THROW_ON_ERROR);
            file_put_contents($case.'/import-plan.json',$plan);chmod($case.'/import-plan.json',0600);
            echo "SULFA_PRIVATE_PLAN_AUTHENTICATED\n";
            PHP
            python3 - <<'PY'
            import os,pathlib,json,hashlib,sqlite3,subprocess
            root=pathlib.Path(os.environ['AHMED_SULFA_ROOT']);case=pathlib.Path(os.environ['AHMED_SULFA_CASE']);stage=case/'staged'
            plan=json.loads((case/'import-plan.json').read_text())
            allowed={'ahmed-api/app/Http/Controllers/Api/SulfaInvestmentController.php','ahmed-mobile/SulfaInvestmentScreen.js'}
            assert {x['path'] for x in plan['source_files']}==allowed
            for item in plan['source_files']:
                assert hashlib.sha256((stage/item['path']).read_bytes()).hexdigest()==item['target_sha256'],'Staged source hash differs'
                assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest() in [item['before_sha256'],item['target_sha256']],'Concurrent source edit'
                if item['path'].endswith('.php'): subprocess.check_call(['/usr/local/bin/php','-l',str(stage/item['path'])])
            proof=json.loads(pathlib.Path('/home/pmsa/secure-backups/ahmed/funding-date-label-1792684447832/build-input-hashes.json').read_text())
            for name,digest in proof.items():
                if name in {'.env','ta3meed/Ta3meedTenantInvestorAccounts.js','SulfaInvestmentScreen.js'}: continue
                assert hashlib.sha256((root/'ahmed-mobile'/name).read_bytes()).hexdigest()==digest,'Existing development changed: '+name
            clone=case/'isolated-test.sqlite'
            if clone.exists(): clone.unlink()
            original=sqlite3.connect('file:'+str(root/'ahmed-api/database/database.sqlite')+'?mode=ro',uri=True)
            original.execute('BEGIN');copy=sqlite3.connect(str(clone));copy.executescript('\n'.join(original.iterdump()));copy.close();original.rollback();original.close();os.chmod(str(clone),0o600)
            print('SULFA_SOURCE_GUARDS_AND_ISOLATED_DATABASE_READY')
            PY
            python3 "$CASE/staged/scripts/import-sulfa-observations.py" --database "$CASE/isolated-test.sqlite" --plan "$CASE/import-plan.json"
            python3 "$CASE/staged/scripts/import-sulfa-observations.py" --database "$CASE/isolated-test.sqlite" --plan "$CASE/import-plan.json" --result "$CASE/repeat-test.json"
            /usr/local/bin/php "$CASE/staged/scripts/verify-sulfa-observations.php" "$ROOT" "$CASE/isolated-test.sqlite" "$CASE/staged/ahmed-api/app/Http/Controllers/Api/SulfaInvestmentController.php" "$CASE/import-plan.json"
            python3 - <<'PY'
            import os,pathlib,json,hashlib,subprocess,tempfile,shutil
            root=pathlib.Path(os.environ['AHMED_SULFA_ROOT']);case=pathlib.Path(os.environ['AHMED_SULFA_CASE']);stage=case/'staged'
            repeat=json.loads((case/'repeat-test.json').read_text());assert repeat['updated']==0 and repeat['inserted']==0
            plan=json.loads((case/'import-plan.json').read_text());changes=[]
            def install(data,path,owner):
                handle,temp=tempfile.mkstemp(prefix='.sulfa-sync-',dir=str(path.parent))
                try:
                    with os.fdopen(handle,'wb') as stream: stream.write(data);stream.flush();os.fsync(stream.fileno())
                    os.chmod(temp,0o644);os.chown(temp,owner.st_uid,owner.st_gid);os.replace(temp,str(path))
                finally:
                    if os.path.exists(temp): os.unlink(temp)
            try:
                for item in plan['source_files']:
                    live=root/item['path'];old=live.read_bytes();digest=hashlib.sha256(old).hexdigest()
                    assert digest in [item['before_sha256'],item['target_sha256']],'Concurrent source edit before install'
                    if digest==item['target_sha256']: continue
                    owner=live.stat();backup=case/'source-before'/item['path'];backup.parent.mkdir(parents=True,exist_ok=True)
                    if not backup.exists(): backup.write_bytes(old);os.chmod(str(backup),0o600)
                    install((stage/item['path']).read_bytes(),live,owner);changes.append((live,old,owner))
                subprocess.check_call(['python3',str(stage/'scripts/import-sulfa-observations.py'),'--database',str(root/'ahmed-api/database/database.sqlite'),'--plan',str(case/'import-plan.json'),'--backup',str(case/'database-before-import.sql'),'--result',str(case/'import-result.json')])
            except BaseException:
                for live,old,owner in reversed(changes): install(old,live,owner)
                raise
            print('SULFA_SCOPED_SOURCE_AND_DATA_INSTALLED')
            PY
            /usr/local/bin/php "$CASE/staged/scripts/verify-sulfa-observations.php" "$ROOT" "$ROOT/ahmed-api/database/database.sqlite" "$ROOT/ahmed-api/app/Http/Controllers/Api/SulfaInvestmentController.php" "$CASE/import-plan.json"
            cd "$ROOT/ahmed-mobile"
            export CI=1 BROWSER=none EXPO_NO_TELEMETRY=1
            RUNTIME="$(dirname "$ROOT")"
            export XDG_CACHE_HOME="$RUNTIME/.cache" TMPDIR="$RUNTIME/.tmp" TMP="$RUNTIME/.tmp" TEMP="$RUNTIME/.tmp"
            mkdir -p "$XDG_CACHE_HOME" "$TMPDIR"
            if ! EXPO_BASE_URL=/webapp npx expo export --platform web --output-dir "$CASE/web-build" > "$CASE/web-build.log" 2>&1; then tail -60 "$CASE/web-build.log"; exit 1; fi
            python3 - <<'PY'
            import os,pathlib,shutil,tempfile,re,hashlib,subprocess
            root=pathlib.Path(os.environ['AHMED_SULFA_ROOT']);case=pathlib.Path(os.environ['AHMED_SULFA_CASE']);build=case/'web-build'
            html=(build/'index.html').read_text()
            for attr in ['src','href']:
                for prefix in ['/_expo/','/assets/']: html=html.replace(attr+'="'+prefix,attr+'="/webapp'+prefix)
            (build/'index.html').write_text(html)
            for dest in [root/'ahmed-mobile/dist-web',root/'ahmed-api/public/webapp']:
                dest.mkdir(parents=True,exist_ok=True)
                for path in build.rglob('*'):
                    if not path.is_file() or path.relative_to(build)==pathlib.Path('index.html'): continue
                    target=dest/path.relative_to(build);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(str(path),str(target));os.chmod(str(target),0o644)
                    folder=target.parent
                    while True:
                        os.chmod(str(folder),0o755)
                        if folder==dest: break
                        folder=folder.parent
                previous=case/('previous-'+dest.parent.name+'-index.html')
                if (dest/'index.html').exists() and not previous.exists(): shutil.copy2(str(dest/'index.html'),str(previous));os.chmod(str(previous),0o600)
                fd,temp=tempfile.mkstemp(prefix='.sulfa-index-',dir=str(dest))
                with os.fdopen(fd,'wb') as stream: stream.write(html.encode())
                os.chmod(temp,0o644);os.replace(temp,str(dest/'index.html'))
            scripts=re.findall(r'<script[^>]+src="([^"]+)"',html);assert scripts
            for src in scripts:
                if '/_expo/' not in src: continue
                url='https://ahmed.pm.sa'+src if src.startswith('/') else 'https://ahmed.pm.sa/webapp/'+src
                served=subprocess.check_output(['curl','-fsS','--retry','2','--max-time','30',url])
                local=root/'ahmed-api/public'/src.lstrip('/') if src.startswith('/') else root/'ahmed-api/public/webapp'/src
                assert hashlib.sha256(served).hexdigest()==hashlib.sha256(local.read_bytes()).hexdigest(),'Public bundle differs'
            print('SULFA_PUBLIC_WEB_BUNDLE_VERIFIED')
            PY
            if [ ! -f "$CASE/native-update.json" ]; then
              if ! npx eas-cli update --channel production --platform all --environment production --message "Update Sulfa verified portfolio observations" --non-interactive --json > "$CASE/native-update.json" 2> "$CASE/native-update.log"; then rm -f "$CASE/native-update.json"; tail -60 "$CASE/native-update.log"; exit 1; fi
            fi
            python3 - <<'PY'
            import os,pathlib,json,subprocess
            case=pathlib.Path(os.environ['AHMED_SULFA_CASE'])
            updates=json.loads((case/'native-update.json').read_text())
            assert {x['platform'] for x in updates}=={'ios','android'} and all(x['runtimeVersion']=='1.0.19' for x in updates)
            for name,url,body,status in [('health','https://ahmed.pm.sa/api/health',None,200),('invalid-login','https://ahmed.pm.sa/api/ahmed/session',{'username':'__sulfa_sync_health_check__','password':'not-a-real-password'},422),('protected-session','https://ahmed.pm.sa/api/ahmed/session',None,401)]:
                out=case/(name+'.json');cmd=['curl','-sS','--max-time','30','-H','Accept: application/json','-o',str(out),'-w','%{http_code}',url]
                if body is not None: cmd+=['-H','Content-Type: application/json','--data',json.dumps(body)]
                actual=int(subprocess.check_output(cmd,universal_newlines=True));json.loads(out.read_text());os.chmod(str(out),0o600)
                assert actual==status,'Unexpected authentication response';print('SULFA_HTTP_VERIFIED',name,actual)
            result={'complete':True,'platforms':sorted(x['platform'] for x in updates),'group':updates[0]['group'],'runtime':'1.0.19','source_commit':os.environ['AHMED_SULFA_TARGET'],'import':json.loads((case/'import-result.json').read_text())}
            (case/'sync-complete.json').write_text(json.dumps(result));os.chmod(str(case/'sync-complete.json'),0o600)
            print('SULFA_SYNC_COMPLETED',json.dumps(result,sort_keys=True))
            PY
