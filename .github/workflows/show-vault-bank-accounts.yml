name: Show vault bank accounts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/show-vault-bank-accounts.yml'
      - 'scripts/patch-vault-bank-accounts.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Patch mobile
        run: python3 scripts/patch-vault-bank-accounts.py

      - name: Validate source
        run: |
          grep -q 'الحسابات البنكية' ahmed-mobile/SecureVaultScreen.js
          grep -q 'function BankAccountCard' ahmed-mobile/SecureVaultScreen.js
          grep -q "item?.category === 'accounts'" ahmed-mobile/SecureVaultScreen.js
          git diff --check

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ahmed-mobile/SecureVaultScreen.js
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Show bank accounts inside secure vault banks [skip vault accounts]"
            git push
          fi

      - name: Clean duplicate IBAN login fields
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AHMED_SSH_HOST }}
          username: ${{ secrets.AHMED_SSH_USER }}
          key: ${{ secrets.AHMED_SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            PROJECT="${{ secrets.AHMED_PROJECT_PATH }}"
            if [ -z "$PROJECT" ] || [ ! -d "$PROJECT" ]; then
              if [ -d "/home/pmsa/apps/ahmed" ]; then PROJECT="/home/pmsa/apps/ahmed"; else PROJECT="/mnt/home-storage/home/pmsa/apps/ahmed"; fi
            fi
            cd "$PROJECT/ahmed-api"
            php artisan tinker --execute='$pairs=[[2,4],[3,6]]; foreach($pairs as [$bankId,$accountId]){$b=\Illuminate\Support\Facades\DB::table("secure_vault_items")->where("id",$bankId)->first();$a=\Illuminate\Support\Facades\DB::table("secure_vault_items")->where("id",$accountId)->first();if(!$b||!$a)continue;$bv="";$av="";try{$bv=strtoupper(preg_replace("/\\s+/u","",\Illuminate\Support\Facades\Crypt::decryptString($b->username_encrypted)));}catch(\Throwable $e){}try{$av=strtoupper(preg_replace("/\\s+/u","",\Illuminate\Support\Facades\Crypt::decryptString($a->username_encrypted)));}catch(\Throwable $e){}if($bv!==""&&$av!==""&&hash_equals($bv,$av)&&str_starts_with($bv,"SA")&&strlen($bv)===24&&empty($b->password_encrypted)){\Illuminate\Support\Facades\DB::table("secure_vault_items")->where("id",$bankId)->update(["username"=>null,"username_encrypted"=>null,"updated_at"=>now()]);echo "cleared duplicate bank IBAN id={$bankId}; account copy preserved\n";}}'
